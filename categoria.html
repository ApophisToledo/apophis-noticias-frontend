<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<!-- ✅ SEO BASE (AGREGADO) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Noticias por categoría en Apophis Noticias">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://TU-DOMINIO.vercel.app/categoria.html">

<title>Categoría - Apophis Noticias</title>

<!-- ✅ OPEN GRAPH -->
<meta property="og:type" content="website">
<meta property="og:title" content="Categoría - Apophis Noticias">
<meta property="og:description" content="Noticias actualizadas por categoría">
<meta property="og:url" content="https://TU-DOMINIO.vercel.app/categoria.html">
<meta property="og:image" content="https://TU-DOMINIO.vercel.app/logo.png">

<!-- ✅ JSON-LD -->
<script type="application/ld+json" id="jsonld"></script>

<script src="https://cdn.tailwindcss.com"></script>

<style>
/* 🔥 TU CSS ORIGINAL RESPETADO */
body{margin:0;font-family:Georgia;background:#f4e3b2;color:#111;transition:.3s;}
body.dark{background:#111;color:#f0e68c;}
.header{background:black;color:gold;padding:25px;display:flex;justify-content:center;align-items:center;gap:10px;cursor:pointer;}
.header span.title{font-size:2rem;}
.eyes{display:inline-block;font-size:1.5rem;animation:blink 4s infinite;}
@keyframes blink{0%,90%,100%{transform:scaleY(1);}95%{transform:scaleY(0.1);}}

.cat-btn{padding:8px 12px;margin:5px;border-radius:8px;border:none;background:#111;color:gold;cursor:pointer;font-weight:bold;}
.cat-btn:hover{background:gold;color:black;}

.main-layout{display:flex;max-width:1200px;margin:auto;gap:20px;}
.sidebar-left, .sidebar-right{flex:0 0 17.5%;}
.noticia-container{flex:0 0 65%;display:flex;flex-wrap:wrap;justify-content:center;}

.noticia-card{
  width:300px;height:200px;background-size:cover;background-position:center;
  margin:10px;border-radius:12px;position:relative;color:white;cursor:pointer;
  transition:.5s;opacity:0;transform:translateY(30px);
}
.noticia-card.loaded{opacity:1;transform:translateY(0);}
.noticia-card:hover{transform:scale(1.05) rotate(-1deg); box-shadow:0 6px 12px rgba(0,0,0,0.4);}

.noticia-card h2{
  position:absolute;bottom:10px;left:10px;margin:0;padding:5px 8px;
  background:rgba(0,0,0,0.6);border-radius:5px;
}

#flayerInner{display:flex;overflow-x:auto;gap:10px;padding:10px;scroll-behavior:smooth;}
.flayer-item{position:relative;cursor:pointer;flex-shrink:0;}
.flayer-item img{width:150px;border-radius:8px;}
.flayer-item span{
  position:absolute;bottom:0;width:100%;background:rgba(0,0,0,0.6);
  color:gold;text-align:center;font-size:0.8rem;opacity:0;
}
.flayer-item:hover span{opacity:1;}

.sidebar-right .noticia-card{height:100px;width:100%;}
.toggle-dark{position:fixed;bottom:10px;right:10px;padding:10px;border-radius:50%;background:gold;cursor:pointer;}

@media(max-width:900px){
  .main-layout{flex-direction:column;}
  .noticia-card{width:90%;}
}
</style>
</head>

<body>

<div class="header" onclick="location.href='index.html'">
  <span class="eyes">𓂀</span>
  <span class="eyes">𓁹</span>
  <span class="title">APOPHIS NOTICIAS</span>
  <span class="eyes">𓁹</span>
  <span class="eyes">𓂀</span>
</div>

<div style="margin:10px;">
  <button class="cat-btn" onclick="location.href='index.html'">🏠 Volver al Inicio</button>
</div>

<!-- ✅ H1 SEO (AGREGADO) -->
<h1 id="tituloCategoria" style="text-align:center;font-size:2rem;margin:10px 0;"></h1>

<div style="text-align:center;">
  <button class="cat-btn" onclick="verCat('Politica')">Política</button>
  <button class="cat-btn" onclick="verCat('Deportes')">Deportes</button>
  <button class="cat-btn" onclick="verCat('Policiales')">Policiales</button>
  <button class="cat-btn" onclick="verCat('Arte')">Arte</button>
  <button class="cat-btn" onclick="verCat('Show')">Show</button>
  <button class="cat-btn" onclick="verCat('Pais')">País</button>
  <button class="cat-btn" onclick="verCat('Mundo')">Mundo</button>
  <button class="cat-btn" onclick="verCat('Ciudad')">Ciudad</button>
</div>

<h3 style="padding-left:10px;">Flayer</h3>
<div id="flayerInner"></div>

<div class="main-layout">
  <div class="sidebar-left"></div>
  <div id="noticiaContainer" class="noticia-container"></div>
  <div id="relacionadas" class="sidebar-right"></div>
</div>

<button class="toggle-dark" onclick="toggleDark()">🌙</button>

<script>
const API="https://apophis-noticias-backend.vercel.app";
let currentCat="Politica";

function toggleDark(){ document.body.classList.toggle("dark"); }
function verCat(cat){ location.href="categoria.html?cat="+cat; }
function ir(id){ location="noticia.html?id="+id; }

const observer=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add("loaded"); }
  });
});

// ✅ SEO DINÁMICO
function aplicarSEO(cat,data){
  document.title = cat + " | Apophis Noticias";
  document.getElementById("tituloCategoria").textContent = "Noticias de " + cat;

  document.querySelector("meta[name='description']").content =
    "Últimas noticias de " + cat + " en Apophis Noticias.";

  document.querySelector("meta[property='og:title']").content =
    "Noticias de " + cat;

  document.querySelector("meta[property='og:description']").content =
    "Información actualizada de " + cat;

  const urlActual = window.location.href;
  document.querySelector("link[rel='canonical']").href = urlActual;
  document.querySelector("meta[property='og:url']").content = urlActual;

  // JSON-LD
  document.getElementById("jsonld").textContent = JSON.stringify({
    "@context":"https://schema.org",
    "@type":"CollectionPage",
    "name":"Noticias de " + cat,
    "url": urlActual
  });
}

async function cargarFlayer(data){
  const flayer=document.getElementById("flayerInner");
  flayer.innerHTML="";

  data.forEach(n=>{
    const div=document.createElement("div");
    div.className="flayer-item";
    div.innerHTML=`
      <img src="${n.imagen}" loading="lazy" decoding="async">
      <span>${n.titulo}</span>
    `;
    div.onclick=()=>ir(n._id);
    flayer.appendChild(div);
  });

  let interval=setInterval(()=>{
    flayer.scrollLeft+=1;
    if(flayer.scrollLeft + flayer.clientWidth >= flayer.scrollWidth){
      flayer.scrollTo({left:0,behavior:"smooth"});
    }
  },20);

  flayer.addEventListener("mouseenter",()=>clearInterval(interval));
}

async function cargarNoticias(){
  const res=await fetch(`${API}/noticias/categoria/${currentCat}`);
  const data=await res.json();

  aplicarSEO(currentCat,data);

  const cont=document.getElementById("noticiaContainer");
  const rel=document.getElementById("relacionadas");

  cont.innerHTML="";
  rel.innerHTML="";

  data.forEach((n,i)=>{
    const card=document.createElement("div");
    card.className="noticia-card";
    card.style.backgroundImage=`url('${n.imagen}')`;
    card.innerHTML=`<h2>${n.titulo}</h2>`;
    card.onclick=()=>ir(n._id);
    cont.appendChild(card);
    observer.observe(card);

    if(i>0 && i<6){
      const r=document.createElement("div");
      r.className="noticia-card";
      r.style.height="100px";
      r.style.backgroundImage=`url('${n.imagen}')`;
      r.innerHTML=`<h2 style="font-size:0.8rem">${n.titulo}</h2>`;
      r.onclick=()=>ir(n._id);
      rel.appendChild(r);
    }
  });

  cargarFlayer(data);
}

window.onload=()=>{
  const params=new URLSearchParams(location.search);
  currentCat=params.get("cat") || "Politica";
  cargarNoticias();
}
</script>

</body>
</html>
