<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="metaTitle">Categoría - Apophis Noticias</title>

<meta name="description" id="metaDesc" content="Noticias por categoría en Apophis Noticias">
<meta name="robots" content="index, follow">

<meta property="og:title" id="ogTitle">
<meta property="og:description" id="ogDesc">
<meta property="og:type" content="website">
<meta property="og:url" id="ogUrl">
<meta property="og:image" id="ogImg">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6641245592697930" crossorigin="anonymous"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>

/* BASE */
body{
  margin:0;
  font-family:Georgia;
  background:#f4e3b2;
  color:#111;
  transition:.3s;
}
body.dark{
  background:#111;
  color:#f0e68c;
}

*{box-sizing:border-box;}

/* 🔥 HEADER PRO */
.header{
  background:black;
  padding:18px 10px;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  box-shadow:0 6px 20px rgba(0,0,0,.3);
}

/* LOGO PREMIUM */
.logo{
  width:min(92vw,420px);
  border-radius:14px;
  cursor:pointer;
  transition:all .35s ease;
  box-shadow:0 0 0 rgba(255,215,0,0);
}

.logo:hover{
  transform:scale(1.04) translateY(-2px);
  box-shadow:
    0 0 20px rgba(255,215,0,.25),
    0 0 40px rgba(255,215,0,.15);
  filter:brightness(1.08);
}

.logo:active{
  transform:scale(.98);
}

/* BOTONES HEADER */
.dark-btn{
  position:absolute;
  right:10px;
  top:10px;
  background:#111;
  color:gold;
  border:none;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
  transition:.2s;
}

.dark-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 4px 10px rgba(0,0,0,.2);
}

/* NAV */
.nav{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  padding:12px;
}

.cat-btn, .volver-btn{
  background:#111;
  color:gold;
  border:none;
  padding:10px 14px;
  border-radius:999px;
  cursor:pointer;
  font-size:14px;
  min-height:42px;
  transition:.2s;
}

.cat-btn:hover, .volver-btn:hover{
  transform:translateY(-1px);
  opacity:.9;
}

/* TITULO */
#titulo{
  text-align:center;
  margin:12px 0 6px;
  font-size:1.7rem;
  letter-spacing:.5px;
}

/* CONTENEDOR */
.wrapper{
  max-width:1200px;
  margin:auto;
  padding:12px;
}

/* FLAYER */
.flayer{
  overflow:hidden;
  margin-bottom:15px;
}

.track{
  display:flex;
  gap:10px;
  width:max-content;
  animation:scroll 28s linear infinite;
}

.item{
  width:230px;
  height:135px;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  flex-shrink:0;
  box-shadow:0 6px 16px rgba(0,0,0,.15);
}

.item img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.item span{
  position:absolute;
  bottom:0;
  width:100%;
  background:rgba(0,0,0,.88);
  color:gold;
  font-size:12px;
  padding:6px;
}

/* GRID PRO */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:18px;
}

/* CARD */
.card{
  height:260px;
  border-radius:16px;
  background-size:cover;
  background-position:center;
  position:relative;
  cursor:pointer;
  overflow:hidden;
  transition:.3s;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.card:hover{
  transform:translateY(-4px);
}

.card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.9), transparent);
}

.card h3{
  position:absolute;
  bottom:10px;
  left:10px;
  right:10px;
  color:gold;
  background:rgba(0,0,0,.85);
  padding:10px;
  border-radius:10px;
  font-size:15px;
  line-height:1.35;
}

/* FOOTER */
footer{
  text-align:center;
  background:#111;
  color:gold;
  padding:20px;
  margin-top:25px;
}

/* 📱 MOBILE */
@media(max-width:768px){

  .logo{
    width:95%;
  }

  #titulo{
    font-size:1.3rem;
  }

  .item{
    width:180px;
    height:110px;
  }

  .card{
    height:220px;
  }
}

@media(max-width:480px){

  .nav{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .cat-btn, .volver-btn{
    width:100%;
  }

  .item{
    width:150px;
    height:95px;
  }

  .card{
    height:200px;
  }
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

  <button class="dark-btn" onclick="toggleDark()">🌙</button>

  <img src="658175444_25680405581633658_3668668824201018733_n.jpg"
       class="logo"
       onclick="location.href='index.html'">

</div>

<!-- NAV -->
<div class="nav">
  <button class="volver-btn" onclick="location.href='index.html'">🏠</button>
  <button class="cat-btn" onclick="verCat('Politica')">Política</button>
  <button class="cat-btn" onclick="verCat('Deportes')">Deportes</button>
  <button class="cat-btn" onclick="verCat('Policiales')">Policiales</button>
  <button class="cat-btn" onclick="verCat('Arte')">Arte</button>
  <button class="cat-btn" onclick="verCat('Show')">Show</button>
  <button class="cat-btn" onclick="verCat('Pais')">País</button>
  <button class="cat-btn" onclick="verCat('Mundo')">Mundo</button>
  <button class="cat-btn" onclick="verCat('Ciudad')">Ciudad</button>
</div>

<h1 id="titulo"></h1>

<div class="wrapper">

  <!-- FLAYER -->
  <div class="flayer">
    <div id="track" class="track"></div>
  </div>

  <!-- GRID -->
  <div id="contenedor" class="grid"></div>

</div>

<footer>
  © 2026 Apophis Noticias |
  <a href="privacidad.html">Privacidad</a> |
  <a href="contacto.html">Contacto</a> |
  <a href="sobre.html">Sobre</a>
</footer>

<script>
const API="https://apophis-noticias-backend.vercel.app";

function toggleDark(){
  const d=document.body.classList.toggle("dark");
  localStorage.setItem("darkMode",d);
}

function verCat(c){
  location="categoria.html?cat="+c;
}

function ir(id){
  location="noticia.html?id="+id;
}

async function cargar(){
  const cat=new URLSearchParams(location.search).get("cat");
  document.getElementById("titulo").innerText=cat;

  const res=await fetch(API+"/noticias/categoria/"+cat);
  const data=await res.json();

  document.getElementById("contenedor").innerHTML=data.map(n=>`
    <div class="card" style="background-image:url('${n.imagen}')" onclick="ir('${n._id}')">
      <h3>${n.titulo}</h3>
    </div>
  `).join("");

  const flayer=data.map(n=>`
    <div class="item" onclick="ir('${n._id}')">
      <img src="${n.imagen}">
      <span>${n.titulo}</span>
    </div>
  `).join("");

  document.getElementById("track").innerHTML=flayer+flayer;
}

cargar();
</script>

</body>
</html>
