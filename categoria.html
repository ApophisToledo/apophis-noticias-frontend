<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="metaTitle">Categoría - Apophis Noticias</title>

<meta name="description" id="metaDesc">
<meta name="robots" content="index, follow">

<meta property="og:title" id="ogTitle">
<meta property="og:description" id="ogDesc">
<meta property="og:type" content="website">
<meta property="og:url" id="ogUrl">
<meta property="og:image" id="ogImg">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6641245592697930" crossorigin="anonymous"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
  margin:0;
  font-family:Georgia;
  background:#f4e3b2;
  color:#111;
  transition:.3s;
}
body.dark{
  background:#111;
  color:#f0e68c;
}

/* HEADER */
.header{
  background:black;
  color:gold;
  padding:20px;
  text-align:center;
  position:relative;
}

.logo{
  max-width:95%;
  border-radius:10px;
  cursor:pointer;
  transition:.3s;
}
.logo:hover{transform:scale(1.05);}

.dark-btn{
  position:absolute;
  right:10px;
  top:10px;
  background:#111;
  color:gold;
  border:none;
  padding:8px 12px;
  border-radius:10px;
}

/* NAV */
.nav{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  padding:12px;
}

.cat-btn, .volver-btn{
  background:#111;
  color:gold;
  border:none;
  padding:10px 14px;
  border-radius:999px;
  cursor:pointer;
  min-height:42px;
}

/* LAYOUT */
.layout{
  display:flex;
  max-width:1200px;
  margin:auto;
  gap:20px;
  padding:12px;
}

.main{
  flex:3;
}

.side{
  flex:1;
}

/* FLAYER */
.flayer{
  overflow:hidden;
  margin-bottom:15px;
}
.track{
  display:flex;
  gap:10px;
  animation:scroll 30s linear infinite;
}
.item{
  min-width:220px;
  height:140px;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
}
.item img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.item span{
  position:absolute;
  bottom:0;
  width:100%;
  background:rgba(0,0,0,.85);
  color:gold;
  padding:6px;
  font-size:13px;
}

@keyframes scroll{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.card{
  height:240px;
  border-radius:14px;
  background-size:cover;
  background-position:center;
  position:relative;
  cursor:pointer;
}
.card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.85), transparent);
}
.card h3{
  position:absolute;
  bottom:10px;
  left:10px;
  right:10px;
  color:gold;
  background:rgba(0,0,0,.8);
  padding:8px;
  border-radius:8px;
}

/* SIDEBAR */
.side-box{
  background:#fff3c4;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}
body.dark .side-box{
  background:#1a1a1a;
}

/* MOBILE */
@media(max-width:900px){
  .layout{flex-direction:column;}
  .grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="header">
  <img src="658175444_25680405581633658_3668668824201018733_n.jpg" class="logo" onclick="location.href='index.html'">
  <button class="dark-btn" onclick="toggleDark()">🌙</button>
</div>

<div class="nav">
  <button class="volver-btn" onclick="location.href='index.html'">🏠 Inicio</button>
  <button class="cat-btn" onclick="verCat('Politica')">Política</button>
  <button class="cat-btn" onclick="verCat('Deportes')">Deportes</button>
  <button class="cat-btn" onclick="verCat('Policiales')">Policiales</button>
  <button class="cat-btn" onclick="verCat('Arte')">Arte</button>
  <button class="cat-btn" onclick="verCat('Show')">Show</button>
  <button class="cat-btn" onclick="verCat('Pais')">País</button>
  <button class="cat-btn" onclick="verCat('Mundo')">Mundo</button>
  <button class="cat-btn" onclick="verCat('Ciudad')">Ciudad</button>
</div>

<h1 id="titulo" style="text-align:center;"></h1>

<div class="layout">

  <div class="main">

    <!-- FLAYER -->
    <div class="flayer">
      <div id="track" class="track"></div>
    </div>

    <!-- GRID -->
    <div id="contenedor" class="grid"></div>

  </div>

  <!-- SIDEBAR -->
  <div class="side">
    <div class="side-box">
      <h3>Más vistas</h3>
      <div id="side"></div>
    </div>

    <div class="side-box">
      <h3>Publicidad</h3>
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-6641245592697930"
           data-ad-slot="1234567890"
           data-ad-format="auto"></ins>
    </div>
  </div>

</div>

<footer style="text-align:center;background:#111;color:gold;padding:20px;">
  © 2026 Apophis Noticias |
  <a href="privacidad.html">Privacidad</a> |
  <a href="contacto.html">Contacto</a> |
  <a href="sobre.html">Sobre</a>
</footer>

<script>
const API="https://apophis-noticias-backend.vercel.app";

function toggleDark(){
  const d=document.body.classList.toggle("dark");
  localStorage.setItem("darkMode",d);
}

function verCat(c){
  location="categoria.html?cat="+c;
}

function ir(id){
  location="noticia.html?id="+id;
}

async function cargar(){
  const cat=new URLSearchParams(location.search).get("cat");

  document.getElementById("titulo").innerText=cat;

  const res=await fetch(API+"/noticias/categoria/"+cat);
  const data=await res.json();

  // GRID
  document.getElementById("contenedor").innerHTML=data.map(n=>`
    <div class="card" style="background-image:url('${n.imagen}')" onclick="ir('${n._id}')">
      <h3>${n.titulo}</h3>
    </div>
  `).join("");

  // FLAYER
  const flayer=data.map(n=>`
    <div class="item" onclick="ir('${n._id}')">
      <img src="${n.imagen}">
      <span>${n.titulo}</span>
    </div>
  `).join("");

  document.getElementById("track").innerHTML=flayer+flayer;

  // SIDEBAR
  document.getElementById("side").innerHTML=data.slice(0,5).map(n=>`
    <div onclick="ir('${n._id}')" style="margin-bottom:10px;cursor:pointer;">
      ${n.titulo}
    </div>
  `).join("");

  try{(adsbygoogle = window.adsbygoogle || []).push({});}catch(e){}
}

cargar();
</script>

</body>
</html>
