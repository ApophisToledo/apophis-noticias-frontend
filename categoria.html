<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Categoría - Apophis</title>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6641245592697930"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{margin:0;font-family:Georgia;background:#f4e3b2;color:#111;}
body.dark{background:#111;color:#f0e68c;}

.header{background:black;color:gold;padding:20px;text-align:center;}

.grid{display:flex;flex-wrap:wrap;gap:15px;justify-content:center;margin:20px;}

.card{
  width:280px;
  height:180px;
  background-size:cover;
  border-radius:10px;
  position:relative;
  cursor:pointer;
}
.card h3{
  position:absolute;
  bottom:0;
  background:black;
  color:gold;
  width:100%;
  padding:5px;
}
</style>
</head>

<body>

<div class="header">APOPHIS NOTICIAS</div>

<div id="contenedor" class="grid"></div>

<script>
const API="https://apophis-noticias-backend.vercel.app";

function ir(id){location="noticia.html?id="+id;}

async function cargarCategoria(){
  const cat=new URLSearchParams(location.search).get("cat");
  if(!cat) return;

  const res=await fetch(API+"/noticias/categoria/"+cat);
  const data=await res.json();

  document.getElementById("contenedor").innerHTML=data.map(n=>`
    <div class="card" style="background-image:url('${n.imagen}')" onclick="ir('${n._id}')">
      <h3>${n.titulo}</h3>
    </div>
  `).join("");
}

cargarCategoria();

// dark mode
if(localStorage.getItem("darkMode")==="true"){
  document.body.classList.add("dark");
}
</script>

</body>
</html>
