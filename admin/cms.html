<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS Guías | Apophis</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../css/styles.css">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#d4af37">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="google-site-verification" content="REEMPLAZAR_CON_TOKEN_SEARCH_CONSOLE">
</head>
<body>
<header class="header">
    <div class="logo-area">
        <h1>CMS Apophis</h1>
        <p>Crear, editar y eliminar guías evergreen.</p>
    </div>
</header>

<main class="admin-layout">
    <section class="admin-panel">
        <h2>Editor de guía</h2>

        <form id="cms-form">
            <input id="cms-current-slug" type="hidden">

            <label>Título</label>
            <input id="cms-title" value="Mejor moto 200 calidad precio en Argentina">

            <label>Categoría</label>
            <select id="cms-category">
                <option value="motos">Motos</option>
                <option value="autos">Autos</option>
                <option value="tecnologia">Tecnología</option>
                <option value="supermercados">Supermercados</option>
            </select>

            <label>Subcategoría</label>
            <input id="cms-subcategory" value="200cc">

            <label>Descripción SEO</label>
            <textarea id="cms-description">Guía completa para elegir una moto 200cc en Argentina considerando precio, consumo y mantenimiento.</textarea>

            <label>Contenido largo HTML</label>
            <textarea id="cms-content"><h2>Introducción</h2><p>Contenido editorial largo pendiente de completar.</p></textarea>

            <label>Imagen destacada</label>
            <input id="cms-image" type="file" accept="image/*">

            <div class="admin-actions">
                <button id="upload-image" type="button">Subir imagen a Cloudinary</button>
            </div>

            <label>URL imagen</label>
            <input id="cms-image-url" placeholder="https://...">

            <label>Keywords</label>
            <input id="cms-keywords" value="moto 200, motos argentina, calidad precio">

            <label>Estado</label>
            <select id="cms-status-select">
                <option value="draft">Borrador</option>
                <option value="published">Publicado</option>
            </select>

            <label>Tiempo de lectura</label>
            <input id="cms-reading" value="10 min">

            <div class="admin-actions">
                <button type="submit">Guardar</button>
                <button id="clear-form" type="button">Nueva guía</button>
            </div>
        </form>

        <div id="cms-status"></div>
    </section>

    <section class="admin-preview">
        <h2>Guías existentes</h2>
        <div id="cms-guides" class="guide-grid"></div>
    </section>
</main>

<script src="../js/config.js"></script>
<script src="./cms.js"></script>

<script src="/js/performance.js"></script>
<script src="/js/accessibility.js"></script>
<script src="../js/analytics.js"></script>
</body>

</html>
