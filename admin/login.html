<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin | Apophis</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="../css/styles.css">

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#d4af37">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="google-site-verification" content="REEMPLAZAR_CON_TOKEN_SEARCH_CONSOLE">
</head>
<body>

<header class="header">
<div class="logo-area">
<h1>Apophis Admin</h1>
<p>Acceso editorial seguro</p>
</div>
</header>

<main class="admin-auth-layout">

<section class="admin-auth-card">

<h2>Panel editorial</h2>

<form id="login-form">

<label>Email</label>
<input type="email" id="email" placeholder="admin@apophis.com">

<label>Contraseña</label>
<input type="password" id="password" placeholder="********">

<button type="submit">Ingresar</button>

</form>

<p class="auth-note">
Fase segura inicial preparada para JWT y backend real.
</p>

<div id="login-status"></div>

</section>

</main>

<script src="./login.js"></script>


<script src="/js/performance.js"></script>
<script src="/js/accessibility.js"></script>
<script src="../js/analytics.js"></script>
</body>

</html>
