<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supermercados | Apophis</title>
<meta name="description" content="Comparativas de supermercados y ahorro real.">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<header class="header">
<div class="logo-area">
<h1>Supermercados</h1>
<p>Comparativas de supermercados y ahorro real.</p>
</div>
</header>

<section class="seo-block">

<h2>Guías disponibles</h2>

<div id="category-guides" class="guide-grid"></div>

</section>

<script>
async function loadCategory(){
    const response = await fetch("../data/articles.json");
    const articles = await response.json();

    const filtered = articles.filter(a => a.category === "supermercados");

    document.querySelector("#category-guides").innerHTML =
        filtered.map(article => `
            <article class="guide-card">
                <span>${article.category}</span>
                <h3>${article.title}</h3>
                <p>${article.description}</p>
            </article>
        `).join("");
}

loadCategory();
</script>

</body>
</html>
