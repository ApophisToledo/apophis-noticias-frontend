:root{
  --bg:#f4e3b2;
  --bg-card:#fdf5d7;
  --text:#111;
  --gold:gold;
  --black:#111;
  --line:rgba(255,215,0,.18);
  --shadow:0 6px 18px rgba(0,0,0,.10);
  --shadow-strong:0 10px 22px rgba(0,0,0,.18);
}

body{
  margin:0;
  font-family:Georgia, serif;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}
body.dark{
  --bg:#111;
  --bg-card:#1a1a1a;
  --text:#f0e68c;
}

*{box-sizing:border-box;}

html{
  scroll-behavior:smooth;
}

img{

}

.header{
  background:black;
  color:var(--gold);
  padding:22px 18px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  position:relative;
  flex-wrap:wrap;
  border-bottom:2px solid var(--line);
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}

.logo-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  cursor:pointer;
  max-width:100%;
}

.logo-img{
  max-width:520px;
  width:min(92vw, 520px);
  height:auto;
  display:block;
  border-radius:12px;
  transition:transform .35s ease, box-shadow .35s ease, filter .35s ease;
  box-shadow:0 0 0 rgba(255,215,0,0);
}

.logo-link:hover .logo-img{
  transform:scale(1.03) translateY(-2px);
  box-shadow:0 0 24px rgba(255,215,0,.28), 0 0 50px rgba(255,215,0,.12);

}

.logo-link:active .logo-img{
  transform:scale(.99);
}

.dark-btn,
.admin-btn{
  position:absolute;
  top:10px;
  background:#111;
  color:gold;
  border:none;
  padding:7px 11px;
  border-radius:8px;
  cursor:pointer;
  z-index:9999;
  font-family:Georgia, serif;
  transition:transform .2s ease, opacity .2s ease, box-shadow .2s ease;
}

.dark-btn{ right:10px; }
.admin-btn{ left:10px; }

.admin-btn:hover,
.dark-btn:hover{

  box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.top-nav-row{

  padding:14px 12px 8px;

}

.top-nav-left{

}

.top-nav-center{

}

.volver-btn,

}

.cat-btn:hover,
.volver-btn:hover{

.stats{

.intro{

.intro-box{

.portada-box{

.portada{

.portada-principal{
  min-height:390px;
  border-radius:14px;
  background-size:cover;
  background-position:center;
  position:relative;
  cursor:pointer;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
  transition:transform .25s ease, box-shadow .25s ease;
}
.portada-principal:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-strong);
}
.portada-principal::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,.18), rgba(0,0,0,.03));
}
.portada-principal h1{

  left:14px;
  right:14px;

  border-radius:10px;
  z-index:2;
  margin:0;
  font-size:1.8rem;
  line-height:1.18;
}

.portada-sec-wrap{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.portada-sec{
  min-height:116px;
  border-radius:12px;
  background-size:cover;
  background-position:center;
  position:relative;
  cursor:pointer;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.10);
  transition:transform .25s ease, box-shadow .25s ease;
}
.portada-sec:hover{

  box-shadow:var(--shadow-strong);
}
.portada-sec::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.76), rgba(0,0,0,.14));
}
.portada-sec h3{
  position:absolute;
  bottom:8px;
  left:8px;
  right:8px;

  color:gold;
  padding:8px;
  font-size:.92rem;
  line-height:1.28;
  border-radius:8px;
  z-index:2;
  margin:0;
}

.flayer-box{
  margin-top:20px;
  padding:16px;
}

.flayer{
  overflow:hidden;
}

.flayer-track{
  display:flex;
  width:max-content;
  animation:scroll 28s linear infinite;
  gap:10px;
}

.flayer-item{
  position:relative;
  flex:0 0 auto;
  width:220px;
  height:132px;
  border-radius:10px;

}

.flayer-item img{
  width:100%;
  height:100%;

}

.flayer-item span{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  background:rgba(0,0,0,.84);
  color:gold;
  font-size:12px;
  padding:7px;
  line-height:1.3;
}

@keyframes scroll{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

.lista-box{
  margin-top:20px;
  padding:18px;

.contenedor-home{

@keyframes aparecer{

  to{opacity:1;transform:translateY(0);}

<script>
const API = "https://apophis-noticias-backend.vercel.app";
const CACHE_TIME = 5 * 60 * 1000;

// 🌙 DARK MODE
function aplicarDarkMode(){
  let dark = localStorage.getItem("darkMode");
  if(dark === null){
    dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  }else{
    dark = dark === "true";
  }
  document.body.classList.toggle("dark", dark);
  const btn = document.getElementById("darkBtn");
  if(btn) btn.innerText = dark ? "☀️" : "🌙";
}

function toggleDark(){
  const activo = document.body.classList.toggle("dark");
  localStorage.setItem("darkMode", activo);
  const btn = document.getElementById("darkBtn");
  if(btn) btn.innerText = activo ? "☀️" : "🌙";
}

// SEO HOME
function actualizarSEOHogar(){
  const titulo = "Apophis Noticias";
  const descripcion = "Apophis Noticias - Información actualizada de Argentina y el mundo";
  const url = location.href;

  document.title = titulo;

  const metaTitle = document.getElementById("metaTitle");
  if(metaTitle) metaTitle.innerText = titulo;

  const metaDesc = document.getElementById("metaDesc");
  if(metaDesc) metaDesc.setAttribute("content", descripcion);

  const ogTitle = document.getElementById("ogTitle");
  if(ogTitle) ogTitle.setAttribute("content", titulo);

function escaparHTML(texto){
  if(texto === undefined || texto === null) return "";
  return String(texto)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function urlImagenSegura(url){
  return escaparHTML(url || "");
}

async function cargarHome(){
  try{
    const cache = localStorage.getItem("noticias_cache");
    const time = Number(localStorage.getItem("noticias_time") || 0);

    if(cache && time && (Date.now() - time < CACHE_TIME)){
      render(JSON.parse(cache));
      return;
    }

    const res = await fetch(API + "/noticias");
    if(!res.ok) throw new Error("No se pudieron cargar las noticias");

    const data = await res.json();

    localStorage.setItem("noticias_cache", JSON.stringify(data));
    localStorage.setItem("noticias_time", String(Date.now()));

    render(data);

  }catch(e){
    console.log(e);
    document.getElementById("portada").innerHTML = `
      <div class="mensaje-estado" style="grid-column:1/-1;">No se pudieron cargar las noticias destacadas.</div>
    `;
    document.getElementById("contenedorHome").innerHTML = `
      <div class="mensaje-estado">No se pudo cargar la portada en este momento.</div>
    `;
    document.getElementById("flayerInner").innerHTML = "";
    document.getElementById("destacadasSide").innerHTML = `
      <div class="mensaje-estado">No se pudieron cargar las destacadas.</div>
    `;
  }
}

function render(data){
  if(!Array.isArray(data) || data.length === 0){
    document.getElementById("portada").innerHTML = `
      <div class="mensaje-estado" style="grid-column:1/-1;">No hay noticias disponibles por el momento.</div>
    `;
    document.getElementById("contenedorHome").innerHTML = `
      <div class="mensaje-estado">Todavía no se publicaron noticias.</div>
    `;
    document.getElementById("flayerInner").innerHTML = "";
    document.getElementById("destacadasSide").innerHTML = `
      <div class="mensaje-estado">No hay noticias destacadas.</div>
    `;
    return;
  }

  const p = data[0];
  const sec = data.slice(1, 5);
  const side = data.slice(0, 5);

  document.getElementById("portada").innerHTML = `
    <div class="portada-principal" style="background-image:url('${urlImagenSegura(p.imagen)}')" onclick="ir('${p._id}')">
      <h1>${escaparHTML(p.titulo || "Sin título")}</h1>
    </div>

    <div class="portada-sec-wrap">
      ${sec.map(n => `
        <div class="portada-sec" style="background-image:url('${urlImagenSegura(n.imagen)}')" onclick="ir('${n._id}')">
          <h3>${escaparHTML(n.titulo || "Sin título")}</h3>
        </div>
      `).join("")}
    </div>
  `;

  document.getElementById("contenedorHome").innerHTML = data.map(n => `
    <div class="noticia-card" style="background-image:url('${urlImagenSegura(n.imagen)}')" onclick="ir('${n._id}')">
      <h2>${escaparHTML(n.titulo || "Sin título")}</h2>
    </div>
  `).join("");

  const flayerHtml = data.map(n => `
    <div class="flayer-item" onclick="ir('${n._id}')">
      <img src="${urlImagenSegura(n.imagen)}" alt="${escaparHTML(n.titulo || "Noticia")}">
      <span>${escaparHTML(n.titulo || "Sin título")}</span>
    </div>
  `).join("");

  document.getElementById("flayerInner").innerHTML = flayerHtml + flayerHtml;

  document.getElementById("destacadasSide").innerHTML = side.map(n => `
    <div class="mini-item" onclick="ir('${n._id}')">
      <img src="${urlImagenSegura(n.imagen)}" alt="${escaparHTML(n.titulo || "Noticia")}">
      <span>${escaparHTML(n.titulo || "Sin título")}</span>
    </div>
  `).join("");

  activarAds();
}

async function buscarNoticias(texto){
  const res = await fetch(API + "/noticias");
  if(!res.ok) throw new Error("Error en búsqueda");

  const data = await res.json();
  const q = texto.trim().toLowerCase();
  if(!q) return null;

  const exacta = data.find(n =>
    (n.titulo || "").toLowerCase().includes(q) ||
    (n.categoria || "").toLowerCase().includes(q) ||
    String(n.contenido || "").toLowerCase().includes(q)
  );

  return exacta || null;
}

function activarBuscador(){
  const buscador = document.getElementById("buscador");
  if(!buscador) return;

  buscador.addEventListener("keydown", async function(e){
    if(e.key === "Enter"){
      const valor = buscador.value.trim();
      if(!valor) return;

      try{
        const encontrada = await buscarNoticias(valor);
        if(encontrada && encontrada._id){
          ir(encontrada._id);
        }else{
          alert("No se encontraron noticias con esa búsqueda.");
        }
      }catch(err){
        alert("No se pudo realizar la búsqueda.");
      }
    }
  });
}
