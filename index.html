<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="metaTitle">Apophis Noticias</title>

<meta name="description" id="metaDesc" content="Apophis Noticias - Información actualizada">
<meta name="robots" content="index, follow">

<meta property="og:title" id="ogTitle" content="Apophis Noticias">
<meta property="og:description" id="ogDesc" content="Noticias actualizadas">
<meta property="og:type" content="website">
<meta property="og:url" id="ogUrl">
<meta property="og:image" id="ogImg">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6641245592697930" crossorigin="anonymous"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
  margin:0;
  font-family:Georgia;
  background:#f4e3b2;
  color:#111;
}
body.dark{
  background:#111;
  color:#f0e68c;
}

*{box-sizing:border-box;}

img{max-width:100%;}

/* HEADER */
.header{
  background:black;
  padding:22px;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

.logo-img{
  width:min(92vw,500px);
  border-radius:12px;
}

/* BOTONES */
.dark-btn, .admin-btn{
  position:absolute;
  top:10px;
  background:#111;
  color:gold;
  border:none;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
  min-height:42px;
}
.dark-btn{right:10px;}
.admin-btn{left:10px;}

/* NAV */
.nav{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  padding:12px;
}

.cat-btn{
  padding:10px 14px;
  border-radius:999px;
  background:#111;
  color:gold;
  border:none;
  cursor:pointer;
  min-height:42px;
}

/* BUSCADOR */
.buscador{
  max-width:1200px;
  margin:15px auto;
  padding:0 12px;
}
.buscador input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #b99c49;
  font-size:16px;
}

/* LAYOUT */
.layout{
  max-width:1200px;
  margin:auto;
  padding:0 12px;
  display:flex;
  gap:20px;
}

.main{flex:3; min-width:0;}
.side{flex:1; min-width:260px;}

/* PORTADA */
.portada{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:12px;
}

.portada-principal{
  min-height:350px;
  background-size:cover;
  background-position:center;
  border-radius:12px;
  position:relative;
}

.portada-principal h1{
  position:absolute;
  bottom:10px;
  left:10px;
  right:10px;
  background:rgba(0,0,0,.8);
  color:gold;
  padding:10px;
  border-radius:8px;
  font-size:1.6rem;
}

.portada-sec{
  min-height:110px;
  background-size:cover;
  border-radius:10px;
  position:relative;
}

.portada-sec h3{
  position:absolute;
  bottom:6px;
  left:6px;
  right:6px;
  background:rgba(0,0,0,.8);
  color:gold;
  padding:6px;
  border-radius:6px;
  font-size:.9rem;
}

/* GRID NOTICIAS */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-top:20px;
}

.card{
  min-height:240px;
  border-radius:12px;
  background-size:cover;
  background-position:center;
  position:relative;
}

.card h2{
  position:absolute;
  bottom:10px;
  left:10px;
  right:10px;
  background:rgba(0,0,0,.8);
  color:white;
  padding:8px;
  border-radius:8px;
}

/* SIDEBAR */
.side-box{
  background:#fdf5d7;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

/* 🔥 FIX MOBILE REAL */
@media(max-width:768px){

  .layout{
    flex-direction:column;
    gap:15px;
    padding:0 10px;
  }

  .portada{
    grid-template-columns:1fr;
    gap:10px;
  }

  .grid{
    grid-template-columns:1fr;
    gap:12px;
  }

  .card{
    min-height:220px;
  }

  .portada-principal{
    min-height:260px;
  }

  .portada-principal h1{
    font-size:1.2rem;
  }

  .nav{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .cat-btn{
    width:100%;
  }

}

/* MOBILE CHICO */
@media(max-width:480px){

  .card{
    min-height:200px;
  }

  .portada-principal{
    min-height:230px;
  }

  .portada-principal h1{
    font-size:1rem;
  }

}

</style>
</head>

<body>

<div class="header">
  <button class="admin-btn" onclick="loginAdmin()">Admin</button>
  <img src="658175444_25680405581633658_3668668824201018733_n.jpg" class="logo-img">
  <button class="dark-btn" onclick="toggleDark()">🌙</button>
</div>

<div class="nav">
  <button class="cat-btn" onclick="verCat('Politica')">Política</button>
  <button class="cat-btn" onclick="verCat('Deportes')">Deportes</button>
  <button class="cat-btn" onclick="verCat('Policiales')">Policiales</button>
  <button class="cat-btn" onclick="verCat('Arte')">Arte</button>
  <button class="cat-btn" onclick="verCat('Show')">Show</button>
  <button class="cat-btn" onclick="verCat('Pais')">País</button>
  <button class="cat-btn" onclick="verCat('Mundo')">Mundo</button>
  <button class="cat-btn" onclick="verCat('Ciudad')">Ciudad</button>
</div>

<div class="buscador">
  <input id="buscador" placeholder="🔍 Buscar noticias...">
</div>

<div class="layout">

  <div class="main">

    <div id="portada" class="portada"></div>

    <div id="contenedorHome" class="grid"></div>

  </div>

  <div class="side">
    <div class="side-box">
      <h3>Destacadas</h3>
      <div id="destacadasSide"></div>
    </div>
  </div>

</div>

<footer style="text-align:center;background:#111;color:gold;padding:20px;margin-top:20px;">
© 2026 Apophis Noticias
</footer>

<script>

const API="https://apophis-noticias-backend.vercel.app";

function toggleDark(){
  document.body.classList.toggle("dark");
}

function verCat(c){
  location="categoria.html?cat="+c;
}

function ir(id){
  location="noticia.html?id="+id;
}

async function cargar(){
  const res=await fetch(API+"/noticias");
  const data=await res.json();

  const p=data[0];
  const sec=data.slice(1,4);

  document.getElementById("portada").innerHTML=`
    <div class="portada-principal" style="background-image:url('${p.imagen}')" onclick="ir('${p._id}')">
      <h1>${p.titulo}</h1>
    </div>

    ${sec.map(n=>`
      <div class="portada-sec" style="background-image:url('${n.imagen}')" onclick="ir('${n._id}')">
        <h3>${n.titulo}</h3>
      </div>
    `).join("")}
  `;

  document.getElementById("contenedorHome").innerHTML=data.map(n=>`
    <div class="card" style="background-image:url('${n.imagen}')" onclick="ir('${n._id}')">
      <h2>${n.titulo}</h2>
    </div>
  `).join("");

}

cargar();

</script>

</body>
</html>
