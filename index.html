<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<!-- ✅ SEO AVANZADO -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Apophis Noticias - Información actualizada de Política, Deportes, Policiales, Arte, Show, Ciudad, País y Mundo.">
<meta name="keywords" content="noticias argentina, noticias rosario, politica, deportes, policiales, actualidad">
<meta name="robots" content="index, follow">

<title>Apophis Noticias</title>

<!-- ✅ OPEN GRAPH -->
<meta property="og:title" content="Apophis Noticias">
<meta property="og:description" content="Noticias actualizadas de Argentina y el mundo">
<meta property="og:type" content="website">
<meta property="og:url" content="https://TU-DOMINIO.vercel.app">
<meta property="og:image" content="https://TU-DOMINIO.vercel.app/logo.png">

<!-- ✅ ADSENSE -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6641245592697930" crossorigin="anonymous"></script>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{margin:0;font-family:Georgia;background:#f4e3b2;color:#111;transition:.3s;}
body.dark{background:#111;color:#f0e68c;}

.header{background:black;color:gold;padding:25px;display:flex;justify-content:center;align-items:center;gap:10px;}
.header span.title{font-size:2rem;cursor:pointer;}

.eyes{animation:blink 4s infinite;}
@keyframes blink{0%,90%,100%{transform:scaleY(1);}95%{transform:scaleY(0.1);}}

/* 🔥 PORTADA */
.portada{
  max-width:1200px;
  margin:20px auto;
  display:flex;
  gap:15px;
}
.principal{
  flex:2;
  height:350px;
  background-size:cover;
  background-position:center;
  border-radius:12px;
  position:relative;
  cursor:pointer;
}
.principal h1{
  position:absolute;
  bottom:0;
  background:rgba(0,0,0,0.6);
  color:gold;
  width:100%;
  padding:10px;
  margin:0;
}

.secundarias{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.secundaria{
  height:110px;
  background-size:cover;
  border-radius:10px;
  position:relative;
  cursor:pointer;
}
.secundaria h3{
  position:absolute;
  bottom:0;
  width:100%;
  background:rgba(0,0,0,0.6);
  color:gold;
  margin:0;
  font-size:14px;
  padding:5px;
}

/* 🔍 BUSCADOR */
#buscador{
  padding:10px;
  width:60%;
  border-radius:8px;
}

/* 🔥 HOME */
.contenedor-home{
  max-width:1200px;
  margin:20px auto;
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  justify-content:center;
}

.noticia-card{
  width:300px;
  height:200px;
  border-radius:12px;
  position:relative;
  color:white;
  cursor:pointer;
  background-size:cover;
  background-position:center;
  transition:.5s;
}

.noticia-card h2{
  position:absolute;
  bottom:10px;
  left:10px;
  background:rgba(0,0,0,0.6);
  padding:5px;
}

/* 🔥 FLAYER SIN LOOP */
.flayer-inner{
  display:flex;
  overflow-x:auto;
}
.flayer-inner img{
  width:200px;
  height:120px;
  margin-right:10px;
  border-radius:8px;
  cursor:pointer;
}

.cat-btn{
  margin:5px;
  padding:8px;
  border-radius:8px;
  background:#111;
  color:gold;
}

footer{
  margin-top:40px;
  padding:20px;
  text-align:center;
  background:#111;
  color:gold;
}
</style>
</head>

<body>

<div class="header">
  <span class="eyes">𓂀</span>
  <span class="title" onclick="location.reload()">APOPHIS NOTICIAS</span>
  <span class="eyes">𓂀</span>
</div>

<!-- 🔍 BUSCADOR -->
<div style="text-align:center;margin:20px;">
  <input id="buscador" placeholder="🔍 Buscar noticias...">
</div>

<!-- 🔥 PORTADA -->
<div class="portada">
  <div id="principal" class="principal"></div>
  <div id="secundarias" class="secundarias"></div>
</div>

<!-- 🔥 FLAYER -->
<div class="flayer">
  <div id="flayerInner" class="flayer-inner"></div>
</div>

<!-- 🔥 HOME -->
<div id="contenedorHome" class="contenedor-home"></div>

<footer>
  © 2026 Apophis Noticias
</footer>

<script>
const API="https://apophis-noticias-backend.vercel.app";

function ir(id){location="noticia.html?id="+id;}

/* 🔥 PORTADA */
async function cargarPortada(){
  const res = await fetch(API+"/noticias/ultimas");
  const data = await res.json();

  if(data.length===0) return;

  const principal=data[0];
  document.getElementById("principal").style.backgroundImage=`url('${principal.imagen}')`;
  document.getElementById("principal").innerHTML=`<h1>${principal.titulo}</h1>`;
  document.getElementById("principal").onclick=()=>ir(principal._id);

  document.getElementById("secundarias").innerHTML=
    data.slice(1,5).map(n=>`
      <div class="secundaria" style="background-image:url('${n.imagen}')" onclick="ir('${n._id}')">
        <h3>${n.titulo}</h3>
      </div>
    `).join("");
}

/* 🔥 HOME NORMAL */
async function cargarHome(){
  const res=await fetch(API+"/noticias");
  const data=await res.json();

  document.getElementById("contenedorHome").innerHTML = data.map(n=>{
    let img=n.imagen || "https://via.placeholder.com/300x200";
    return `<div class="noticia-card" style="background-image:url('${img}')" onclick="ir('${n._id}')">
              <h2>${n.titulo}</h2>
            </div>`;
  }).join("");

  document.getElementById("flayerInner").innerHTML = data.map(n=>{
    return `<img src="${n.imagen}" onclick="ir('${n._id}')">`;
  }).join("");
}

/* 🔍 BUSCADOR */
document.getElementById("buscador").addEventListener("keyup", async function(e){
  const texto=e.target.value;

  if(texto.length<2){
    cargarHome();
    return;
  }

  const res=await fetch(API+"/noticias/buscar/"+texto);
  const data=await res.json();

  document.getElementById("contenedorHome").innerHTML = data.map(n=>{
    return `<div class="noticia-card" style="background-image:url('${n.imagen}')" onclick="ir('${n._id}')">
              <h2>${n.titulo}</h2>
            </div>`;
  }).join("");
});

window.onload=()=>{
  cargarPortada();
  cargarHome();
};
</script>

</body>
</html>
