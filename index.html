<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Apophis Noticias - Información actualizada de Argentina y el mundo">
<meta name="robots" content="index, follow">

<title>Apophis Noticias</title>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6641245592697930" crossorigin="anonymous"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{margin:0;font-family:Georgia;background:#f4e3b2;color:#111;transition:.3s;}
body.dark{background:#111;color:#f0e68c;}

.header{
  background:black;
  color:gold;
  padding:30px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  position:relative;
}

.header span.title{
  font-size:3rem;
  font-weight:bold;
  text-shadow:2px 2px 6px black;
  cursor:pointer;
}

.eyes{font-size:1.5rem;animation:blink 4s infinite;}
@keyframes blink{95%{transform:scaleY(0.1);}}

/* BUSCADOR */
#buscador{padding:10px;width:60%;border-radius:8px;}

/* CATEGORÍAS */
.cat-btn{margin:5px;padding:8px 12px;border-radius:8px;background:#111;color:gold;cursor:pointer;}

/* PORTADA */
.portada{max-width:1200px;margin:20px auto;display:grid;grid-template-columns:2fr 1fr;gap:15px;}
.portada-principal{height:350px;border-radius:12px;background-size:cover;position:relative;cursor:pointer;}
.portada-principal h1{position:absolute;bottom:10px;left:10px;background:black;color:gold;padding:10px;}
.portada-sec{height:110px;border-radius:10px;background-size:cover;position:relative;cursor:pointer;}
.portada-sec h3{position:absolute;bottom:5px;left:5px;background:black;color:gold;padding:5px;font-size:0.8rem;}

/* HOME */
.contenedor-home{max-width:1200px;margin:auto;display:flex;flex-wrap:wrap;gap:15px;justify-content:center;}
.noticia-card{width:300px;height:200px;border-radius:12px;background-size:cover;position:relative;cursor:pointer;}
.noticia-card h2{position:absolute;bottom:10px;left:10px;background:black;color:white;padding:5px;}

/* FLAYER PERFECTO */
.flayer{overflow:hidden;margin:20px;}
.flayer-track{
  display:flex;
  width:max-content;
  animation:scroll 25s linear infinite;
}
.flayer-track img{
  width:200px;height:120px;margin-right:10px;border-radius:8px;
}
@keyframes scroll{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

/* ADS */
.ad{margin:20px auto;text-align:center;}
.sticky-ad{position:fixed;bottom:0;width:100%;background:white;text-align:center;z-index:999;}

/* STATS */
.stats{
  position:fixed;
  top:10px;
  right:10px;
  background:black;
  color:gold;
  padding:10px;
  border-radius:8px;
  font-size:12px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <span class="eyes">𓂀</span>
  <span class="title" onclick="location.reload()">APOPHIS NOTICIAS</span>
  <span class="eyes">𓂀</span>
  <button onclick="loginAdmin()">Admin</button>
</div>

<!-- STATS -->
<div class="stats">
  👁 <span id="visitas">0</span><br>
  🔴 <span id="online">0</span>
</div>

<!-- BUSCADOR -->
<div style="text-align:center;margin:20px;">
  <input id="buscador" placeholder="🔍 Buscar noticias...">
</div>

<!-- CATEGORÍAS -->
<div style="text-align:center;">
  <button class="cat-btn" onclick="verCat('Politica')">Política</button>
  <button class="cat-btn" onclick="verCat('Deportes')">Deportes</button>
  <button class="cat-btn" onclick="verCat('Policiales')">Policiales</button>
  <button class="cat-btn" onclick="verCat('Arte')">Arte</button>
  <button class="cat-btn" onclick="verCat('Show')">Show</button>
  <button class="cat-btn" onclick="verCat('Pais')">País</button>
  <button class="cat-btn" onclick="verCat('Mundo')">Mundo</button>
  <button class="cat-btn" onclick="verCat('Ciudad')">Ciudad</button>
</div>

<!-- 🔥 ANUNCIO TOP -->
<div class="ad">
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-6641245592697930"
     data-ad-slot="1111111111"
     data-ad-format="auto"></ins>
</div>

<!-- PORTADA -->
<div class="portada" id="portada"></div>

<!-- FLAYER -->
<div class="flayer">
  <div id="flayerInner" class="flayer-track"></div>
</div>

<!-- HOME -->
<div id="contenedorHome" class="contenedor-home"></div>

<!-- 🔥 ANUNCIO MEDIO -->
<div class="ad">
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-6641245592697930"
     data-ad-slot="2222222222"
     data-ad-format="rectangle"></ins>
</div>

<!-- STICKY -->
<div class="sticky-ad">
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-6641245592697930"
     data-ad-slot="3333333333"
     data-ad-format="horizontal"></ins>
</div>

<script>
const API="https://apophis-noticias-backend.vercel.app";

function loginAdmin(){
  const u=prompt("Usuario");
  const p=prompt("Pass");
  if(u==="Apophis"&&p==="1234") location="admin.html";
}

function verCat(c){location="categoria.html?cat="+c;}
function ir(id){location="noticia.html?id="+id;}

// HOME + PORTADA
async function cargarHome(){
  const res=await fetch(API+"/noticias");
  const data=await res.json();

  if(!data || data.length===0) return;

  const p=data[0];
  const sec=data.slice(1,5);

  document.getElementById("portada").innerHTML=`
    <div class="portada-principal" style="background-image:url('${p.imagen}')" onclick="ir('${p._id}')">
      <h1>${p.titulo}</h1>
    </div>
    <div>
      ${sec.map(n=>`
        <div class="portada-sec" style="background-image:url('${n.imagen}')" onclick="ir('${n._id}')">
          <h3>${n.titulo}</h3>
        </div>`).join("")}
    </div>
  `;

  document.getElementById("contenedorHome").innerHTML=data.map(n=>`
    <div class="noticia-card" style="background-image:url('${n.imagen}')" onclick="ir('${n._id}')">
      <h2>${n.titulo}</h2>
    </div>`).join("");

  // FLAYER LOOP PERFECTO
  const html=data.map(n=>`<img src="${n.imagen}" onclick="ir('${n._id}')">`).join("");
  document.getElementById("flayerInner").innerHTML=html+html;
}

// BUSCADOR
document.getElementById("buscador").addEventListener("keyup",async e=>{
  const t=e.target.value;
  if(t.length<2)return cargarHome();

  const res=await fetch(API+"/noticias/buscar/"+t);
  const data=await res.json();

  document.getElementById("contenedorHome").innerHTML=data.map(n=>`
    <div class="noticia-card" style="background-image:url('${n.imagen}')" onclick="ir('${n._id}')">
      <h2>${n.titulo}</h2>
    </div>`).join("");
});

// VISITAS
async function visitas(){
  const res=await fetch(API+"/visitas");
  const d=await res.json();
  document.getElementById("visitas").innerText=d.visitas;
}

// ONLINE PRO
function online(){
  setInterval(()=>{
    document.getElementById("online").innerText=Math.floor(Math.random()*50)+10;
  },3000);
}

// ADS lazy load (viewability)
setTimeout(()=>{
  (adsbygoogle = window.adsbygoogle || []).push({});
},2000);

window.onload=()=>{
  cargarHome();
  visitas();
  online();
};
</script>

</body>
</html>
