<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin - Apophis Noticias</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Admin panel Apophis Noticias">
<meta name="google-site-verification" content="lJglm09bqinSVZ3sCMJ9hOFpgenFldmc6TcWZe5eE28" />

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{margin:0;font-family:Georgia;background:#f4e3b2;color:#111;transition:.3s;}
body.dark{background:#111;color:#f0e68c;}
.header{
  background:black;
  color:gold;
  padding:25px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}
.container{
  max-width:1000px;
  margin:20px auto;
  padding:20px;
  background:rgba(255,255,255,0.95);
  border-radius:12px;
}

/* 🔥 EDITOR TOOLBAR */
.toolbar{
  display:flex;
  gap:5px;
  margin-bottom:5px;
}
.toolbar button{
  background:gold;
  color:black;
  font-size:12px;
}

/* INPUTS */
input, select{
  width:100%;
  padding:8px;
  margin:5px 0;
  border-radius:6px;
  border:1px solid #111;
}
button{
  padding:8px 12px;
  margin-top:5px;
  border:none;
  border-radius:8px;
  background:#111;
  color:gold;
  cursor:pointer;
  font-weight:bold;
}

/* NOTICIAS */
.news-box{display:flex;flex-wrap:wrap;gap:15px;margin-top:20px;}
.news-card{width:220px;height:150px;background-size:cover;background-position:center;border-radius:8px;}
.news-wrapper{width:220px;}
.news-actions{display:flex;justify-content:space-between;margin-top:5px;}
.news-title{font-weight:bold;text-align:center;margin-top:5px;}
.edit-btn{background:gold;color:black;}
.delete-btn{background:red;color:white;}

/* GALERÍA */
.gallery{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:10px;
}
.gallery img{
  width:100px;
  height:70px;
  object-fit:cover;
  border-radius:6px;
  cursor:pointer;
  border:2px solid #111;
}
</style>
</head>

<body>

<div class="header">
  <span>ADMIN - APOPHIS NOTICIAS</span>
</div>

<div class="container">

<h2>Crear / Editar Noticia</h2>

<input type="hidden" id="noticiaId">

<input type="text" id="titulo" placeholder="Título">

<!-- 🔥 EDITOR TIPO WORD -->
<div class="toolbar">
  <button onclick="format('bold')">B</button>
  <button onclick="format('italic')">I</button>
  <button onclick="format('underline')">U</button>
  <button onclick="format('insertUnorderedList')">• Lista</button>
  <button onclick="format('insertOrderedList')">1. Lista</button>
  <button onclick="agregarLink()">🔗 Link</button>
  <button onclick="format('h2')">H2</button>
</div>

<div contenteditable="true" id="textoEditor"
     style="min-height:200px;border:1px solid #111;padding:10px;background:white;"></div>

<select id="categoria">
  <option value="Politica">Política</option>
  <option value="Deportes">Deportes</option>
  <option value="Policiales">Policiales</option>
  <option value="Arte">Arte</option>
  <option value="Show">Show</option>
  <option value="Pais">País</option>
  <option value="Mundo">Mundo</option>
  <option value="Ciudad">Ciudad</option>
</select>

<input type="text" id="imagen" placeholder="URL de imagen principal">
<button onclick="agregarImagen()">➕ Agregar imagen a galería</button>

<div class="gallery" id="gallery"></div>

<!-- 🤖 IA -->
<h3>🤖 IA Automática</h3>
<input type="text" id="tituloIA" placeholder="Título IA">
<input type="text" id="fuenteIA" placeholder="Fuente (opcional)">
<button onclick="generarIA()">Generar con IA</button>
<button onclick="generarIARapida()">⚡ IA automática</button>

<button onclick="guardarNoticia()">Guardar</button>

<h2>Noticias existentes</h2>
<div id="newsBox" class="news-box"></div>

</div>

<script>
const API="https://apophis-noticias-backend.vercel.app";
let TOKEN="";

// 🔐 LOGIN
async function loginAdmin(){
  const user=prompt("Usuario:");
  const pass=prompt("Pass:");
  if(!user || !pass) return loginAdmin();

  const res=await fetch(API+"/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({user,pass})
  });

  const data=await res.json();
  if(!data.token){
    alert("❌ Login incorrecto");
    return loginAdmin();
  }
  TOKEN=data.token;
}

loginAdmin();

// EDITOR
function format(cmd){
  if(cmd==="h2"){document.execCommand("formatBlock", false, "h2");}
  else{document.execCommand(cmd,false,null);}
}
function agregarLink(){
  const url=prompt("URL:");
  document.execCommand("createLink", false, url);
}

// GALERÍA
let galeriaArray=[];
function agregarImagen(){
  const url=document.getElementById("imagen").value;
  if(!url) return alert("Ingresa URL de imagen");
  galeriaArray.push(url);
  actualizarGaleria();
}
function actualizarGaleria(){
  const g=document.getElementById("gallery");
  g.innerHTML=galeriaArray.map(u=>`<img src="${u}" onclick="removerImagen('${u}')">`).join("");
}
function removerImagen(u){
  galeriaArray=galeriaArray.filter(i=>i!==u);
  actualizarGaleria();
}

// NOTICIAS
async function cargarNoticias(){
  const res=await fetch(API+"/noticias");
  const noticias=await res.json();
  const box=document.getElementById("newsBox");
  box.innerHTML="";
  if(!noticias.length){box.innerHTML="<p>No hay noticias aún</p>"; return;}
  noticias.forEach(n=>{
    const wrapper=document.createElement("div");
    wrapper.className="news-wrapper";

    const card=document.createElement("div");
    card.className="news-card";
    card.style.backgroundImage=`url('${n.imagen || ""}')`;

    const title=document.createElement("div");
    title.className="news-title";
    title.textContent=n.titulo;

    const actions=document.createElement("div");
    actions.className="news-actions";

    const editBtn=document.createElement("button");
    editBtn.className="edit-btn";
    editBtn.textContent="Editar";
    editBtn.onclick=()=>editarNoticia(n);

    const deleteBtn=document.createElement("button");
    deleteBtn.className="delete-btn";
    deleteBtn.textContent="Borrar";
    deleteBtn.onclick=()=>borrarNoticia(n._id);

    actions.appendChild(editBtn);
    actions.appendChild(deleteBtn);

    wrapper.appendChild(card);
    wrapper.appendChild(title);
    wrapper.appendChild(actions);

    box.appendChild(wrapper);
  });
}

// EDITAR
function editarNoticia(n){
  document.getElementById("noticiaId").value=n._id;
  document.getElementById("titulo").value=n.titulo;
  document.getElementById("textoEditor").innerHTML=n.contenido;
  document.getElementById("categoria").value=n.categoria || "Mundo";
  document.getElementById("imagen").value=n.imagen || "";
  galeriaArray=n.galeria || [];
  actualizarGaleria();
}

// BORRAR
async function borrarNoticia(id){
  await fetch(API+"/noticias/"+id,{
    method:"DELETE",
    headers:{Authorization:"Bearer "+TOKEN}
  });
  cargarNoticias();
}

// GUARDAR
async function guardarNoticia(){
  const titulo=document.getElementById("titulo").value;
  if(!titulo) return alert("⚠️ Falta el título");

  const id=document.getElementById("noticiaId").value;
  const body={
    titulo,
    contenido:document.getElementById("textoEditor").innerHTML,
    categoria:document.getElementById("categoria").value,
    imagen:document.getElementById("imagen").value,
    galeria: galeriaArray
  };

  if(id){
    await fetch(API+"/noticias/"+id,{
      method:"PUT",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+TOKEN
      },
      body:JSON.stringify(body)
    });
  }else{
    await fetch(API+"/noticias",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+TOKEN
      },
      body:JSON.stringify(body)
    });
  }

  alert("✅ Guardado");
  cargarNoticias();
}

// IA
async function generarIA(){
  const titulo=document.getElementById("tituloIA").value;
  if(!titulo){alert("Falta título IA"); return;}
  const res=await fetch(API+"/generar-noticia-ia",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({titulo})
  });
  const data=await res.json();
  if(data.ok){alert("✅ IA creó noticia"); cargarNoticias();}
  else{alert(data.msg || "Error IA");}
}
async function generarIARapida(){
  const temas=["Últimas noticias en Argentina","Impacto económico actual","Cambios políticos recientes","Avances tecnológicos"];
  const titulo=temas[Math.floor(Math.random()*temas.length)];
  const res=await fetch(API+"/generar-noticia-ia",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({titulo})
  });
  const data=await res.json();
  if(data.ok){alert("🚀 IA automática creada"); cargarNoticias();}
}

window.onload=cargarNoticias;
</script>

</body>
</html>
