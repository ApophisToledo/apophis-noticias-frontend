<style>
body{margin:0;font-family:Georgia;background:#f4e3b2;color:#111;transition:.3s;}
body.dark{background:#111;color:#f0e68c;}

*{box-sizing:border-box;}

.header{
  background:black;
  color:gold;
  padding:25px;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}

.header span{
  font-weight:bold;
  letter-spacing:.5px;
}

.dark-btn{
  position:absolute;
  right:12px;
  top:12px;
  background:#111;
  color:gold;
  border:none;
  padding:7px 11px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:20px auto;
  padding:20px;
  background:white;
  border-radius:12px;
  box-shadow:0 8px 22px rgba(0,0,0,.12);
}
body.dark .container{
  background:#1a1a1a;
  box-shadow:0 8px 22px rgba(0,0,0,.35);
}

.top-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.left-actions,.right-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
}

.toolbar{
  display:flex;
  gap:5px;
  margin-bottom:5px;
  flex-wrap:wrap;
}
.toolbar button{
  background:gold;
  color:black;
  font-size:12px;
  margin-top:0;
}

input, select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:6px;
  border:1px solid #111;
  background:#fff;
  color:#111;
}
body.dark input,
body.dark select{
  background:#111;
  color:#f0e68c;
  border-color:#6f5b28;
}

textarea{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:6px;
  border:1px solid #111;
  background:#fff;
  color:#111;
  font-family:Georgia;
}
body.dark textarea{
  background:#111;
  color:#f0e68c;
  border-color:#6f5b28;
}

button{
  padding:8px 12px;
  margin-top:5px;
  border:none;
  border-radius:8px;
  background:#111;
  color:gold;
  cursor:pointer;
  font-weight:bold;
}
button:hover{opacity:.92;}
button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.section-box{
  border:1px solid rgba(0,0,0,.12);
  border-radius:12px;
  padding:16px;
  margin-bottom:18px;
  background:#fffdf7;
}
body.dark .section-box{
  background:#222;
  border-color:#444;
}

.grid-form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.editor-wrap{
  margin-top:8px;
}

#textoEditor{
  min-height:260px;
  border:1px solid #111;
  padding:12px;
  background:white;
  border-radius:10px;
  line-height:1.6;
}
body.dark #textoEditor{
  background:#111;
  color:#f0e68c;
  border-color:#6f5b28;
}

.drop-zone{
  border:2px dashed #111;
  padding:20px;
  text-align:center;
  margin:10px 0;
  border-radius:10px;
  background:#fafafa;
  cursor:pointer;
  transition:.25s;
}
.drop-zone.dragover{background:#ffe9a8;}
body.dark .drop-zone{
  background:#181818;
  border-color:#7d6523;
}
body.dark .drop-zone.dragover{
  background:#2b230d;
}

.preview-principal{
  margin-top:10px;
  display:none;
}
.preview-principal img{
  width:100%;
  max-width:420px;
  max-height:260px;
  object-fit:cover;
  border-radius:10px;
  border:2px solid #111;
}
body.dark .preview-principal img{
  border-color:#6f5b28;
}

.gallery{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:10px;
}
.img-box{
  position:relative;
}
.img-box img{
  width:100px;
  height:70px;
  object-fit:cover;
  border-radius:6px;
  border:2px solid #111;
}
body.dark .img-box img{
  border-color:#6f5b28;
}
.delete-img{
  position:absolute;
  top:-5px;
  right:-5px;
  background:red;
  color:white;
  border-radius:50%;
  width:20px;
  height:20px;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.status-bar{
  margin:10px 0;
  padding:10px 12px;
  border-radius:8px;
  display:none;
  font-weight:bold;
}
.status-ok{
  display:block;
  background:#e9ffe5;
  color:#185c16;
}
.status-err{
  display:block;
  background:#ffe5e5;
  color:#7a1414;
}
.status-info{
  display:block;
  background:#fff6d9;
  color:#6f5200;
}
body.dark .status-ok{
  background:#17311a;
  color:#b8ffb2;
}
body.dark .status-err{
  background:#3b1a1a;
  color:#ffb5b5;
}
body.dark .status-info{
  background:#3b3114;
  color:#ffe08a;
}

.news-topbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.news-search{
  max-width:360px;
  width:100%;
}

.news-box{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  margin-top:20px;
}

.news-wrapper{
  width:220px;
  background:#fffdf7;
  border-radius:10px;
  padding:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
body.dark .news-wrapper{
  background:#222;
  box-shadow:none;
}

.news-card{
  width:100%;
  height:150px;
  background-size:cover;
  background-position:center;
  border-radius:8px;
  background-color:#ddd;
}
.news-title{
  text-align:center;
  font-weight:bold;
  margin-top:8px;
  min-height:48px;
}
.news-meta{
  font-size:12px;
  text-align:center;
  opacity:.85;
  min-height:34px;
}
.news-actions{
  display:flex;
  justify-content:space-between;
  gap:6px;
  margin-top:5px;
}
.news-actions button{
  flex:1;
}

.empty-box{
  width:100%;
  padding:18px;
  text-align:center;
  border-radius:10px;
  background:rgba(0,0,0,.05);
}
body.dark .empty-box{
  background:rgba(255,255,255,.05);
}

.admin-note{
  font-size:13px;
  opacity:.85;
  margin-top:6px;
}

@media(max-width:860px){
  .grid-form{
    grid-template-columns:1fr;
  }
  .top-actions,
  .news-topbar{
    flex-direction:column;
    align-items:stretch;
  }
  .left-actions,
  .right-actions{
    width:100%;
  }
  .news-wrapper{
    width:100%;
  }
  .news-card{
    height:190px;
  }
}
</style>
</head>

<body>

<div class="header">
  <span>ADMIN - APOPHIS NOTICIAS PRO</span>
  <button class="dark-btn" onclick="toggleDark()" id="darkBtn">🌙</button>
</div>

<div class="container">

  <div id="statusBar" class="status-bar"></div>

  <div class="top-actions">
    <div class="left-actions">
      <button onclick="nuevaNoticia()">➕ Nueva noticia</button>
      <button onclick="cargarNoticias()">🔄 Recargar noticias</button>
      <button onclick="loginAdmin()">🔐 Reingresar</button>
    </div>
    <div class="right-actions">
      <button onclick="location.href='index.html'">🏠 Ir al sitio</button>
    </div>
  </div>

  <div class="section-box">
    <h2>Crear / Editar Noticia</h2>

    <input type="hidden" id="noticiaId">

    <div class="grid-form">
      <div>
        <label for="titulo"><strong>Título</strong></label>
        <input type="text" id="titulo" placeholder="Título">
      </div>

      <div>
        <label for="autor"><strong>Autor</strong></label>
        <input type="text" id="autor" placeholder="Autor o Redacción Apophis">
      </div>

      <div>
        <label for="categoria"><strong>Categoría</strong></label>
        <select id="categoria">
          <option value="Politica">Política</option>
          <option value="Deportes">Deportes</option>
          <option value="Policiales">Policiales</option>
          <option value="Arte">Arte</option>
          <option value="Show">Show</option>
          <option value="Pais">País</option>
          <option value="Mundo">Mundo</option>
          <option value="Ciudad">Ciudad</option>
        </select>
      </div>

      <div>
        <label for="fecha"><strong>Fecha</strong></label>
        <input type="date" id="fecha">
      </div>
    </div>

    <div class="editor-wrap">
      <label><strong>Contenido</strong></label>

      <div class="toolbar">
        <button onclick="format('bold')" type="button">B</button>
        <button onclick="format('italic')" type="button">I</button>
        <button onclick="format('underline')" type="button">U</button>
        <button onclick="format('insertUnorderedList')" type="button">• Lista</button>
        <button onclick="format('insertOrderedList')" type="button">1. Lista</button>
        <button onclick="insertarParrafo()" type="button">Párrafo</button>
      </div>

      <div contenteditable="true" id="textoEditor"></div>
      <div class="admin-note">Podés escribir, pegar texto, aplicar negrita/cursiva/subrayado y subir imágenes dentro del contenido.</div>
    </div>

    <div class="grid-form" style="margin-top:12px;">
      <div>
        <label for="imagen"><strong>Imagen principal</strong></label>
        <input type="text" id="imagen" placeholder="URL o pegar imagen">
      </div>
      <div style="display:flex;align-items:end;">
        <button onclick="usarPrimeraImagenGaleria()" type="button">🖼 Usar primera imagen de galería</button>
      </div>
    </div>

    <div id="previewPrincipal" class="preview-principal"></div>

    <div id="dropZone" class="drop-zone">
      📸 Arrastrá, pegá (CTRL+V), o hacé click para subir imágenes
    </div>

    <input type="file" id="fileInput" multiple accept="image/*" style="display:none;">

    <div class="gallery" id="gallery"></div>

    <div class="top-actions" style="margin-top:12px;">
      <div class="left-actions">
        <button onclick="guardarNoticia()" id="btnGuardar">💾 Guardar</button>
        <button onclick="limpiarEditor()" type="button">🧹 Limpiar editor</button>
      </div>
      <div class="right-actions">
        <button onclick="nuevaNoticia()" type="button">↩ Resetear formulario</button>
      </div>
    </div>
  </div>

  <div class="section-box">
    <div class="news-topbar">
      <h2 style="margin:0;">Noticias existentes</h2>
      <input type="text" id="buscadorNoticias" class="news-search" placeholder="🔍 Buscar por título, categoría o autor">
    </div>

    <div id="newsBox" class="news-box"></div>
  </div>

</div>

<script>
const API="https://apophis-noticias-backend.vercel.app";
let TOKEN="";
let galeriaArray=[];
let noticiasCache=[];

// 🌙 DARK MODE
function aplicarDarkMode(){
  let dark = localStorage.getItem("darkMode");
  if(dark === null){
    dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  }else{
    dark = dark === "true";
  }
  document.body.classList.toggle("dark", dark);
  const btn = document.getElementById("darkBtn");
  if(btn) btn.innerText = dark ? "☀️" : "🌙";
}

function toggleDark(){
  const activo = document.body.classList.toggle("dark");
  localStorage.setItem("darkMode", activo);
  const btn = document.getElementById("darkBtn");
  if(btn) btn.innerText = activo ? "☀️" : "🌙";
}

function mostrarEstado(tipo, mensaje){
  const bar = document.getElementById("statusBar");
  bar.className = "status-bar";
  if(tipo === "ok") bar.classList.add("status-ok");
  if(tipo === "err") bar.classList.add("status-err");
  if(tipo === "info") bar.classList.add("status-info");
  bar.innerText = mensaje;
}

function limpiarEstado(){
  const bar = document.getElementById("statusBar");
  bar.className = "status-bar";
  bar.innerText = "";
}

function setLoadingBoton(id, activo, textoNormal, textoLoading){
  const btn = document.getElementById(id);
  if(!btn) return;
  btn.disabled = activo;
  btn.innerText = activo ? textoLoading : textoNormal;
}

// LOGIN
async function loginAdmin(){
  try{
    const user = prompt("Usuario:");
    if(user === null) return;

    const pass = prompt("Pass:");
    if(pass === null) return;

    mostrarEstado("info", "Verificando acceso...");

    const res = await fetch(API + "/login", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({user,pass})
    });

    const data = await res.json().catch(()=>({}));

    if(!res.ok || !data.token){
      mostrarEstado("err", "❌ Login incorrecto");
      alert("❌ Login incorrecto");
      return;
    }

    TOKEN = data.token;
    localStorage.setItem("admin_token_apophis", TOKEN);
    mostrarEstado("ok", "✅ Sesión iniciada correctamente");
    cargarNoticias();

  }catch(err){
    console.error(err);
    mostrarEstado("err", "No se pudo iniciar sesión.");
    alert("❌ No se pudo iniciar sesión");
  }
}

// intentar restaurar token guardado
function restaurarToken(){
  const saved = localStorage.getItem("admin_token_apophis");
  if(saved){
    TOKEN = saved;
  }
}

// EDITOR
function format(cmd){
  document.execCommand(cmd,false,null);
  document.getElementById("textoEditor").focus();
}

function insertarParrafo(){
  document.execCommand("insertHTML", false, "<p><br></p>");
  document.getElementById("textoEditor").focus();
}

function limpiarEditor(){
  if(confirm("¿Seguro que querés limpiar solo el contenido del editor?")){
    document.getElementById("textoEditor").innerHTML = "";
  }
}

// NUEVA
function nuevaNoticia(){
  document.getElementById("noticiaId").value = "";
  document.getElementById("titulo").value = "";
  document.getElementById("autor").value = "";
  document.getElementById("fecha").value = "";
  document.getElementById("textoEditor").innerHTML = "";
  document.getElementById("imagen").value = "";
  galeriaArray = [];
  actualizarGaleria();
  actualizarPreviewPrincipal();
  limpiarEstado();
}

function actualizarPreviewPrincipal(){
  const box = document.getElementById("previewPrincipal");
  const url = document.getElementById("imagen").value.trim();

  if(url){
    box.style.display = "block";
    box.innerHTML = `<div><strong>Vista previa principal</strong></div><img src="${url}" alt="Vista previa">`;
  }else{
    box.style.display = "none";
    box.innerHTML = "";
  }
}

function usarPrimeraImagenGaleria(){
  if(!galeriaArray.length){
    alert("No hay imágenes en la galería.");
    return;
  }
  document.getElementById("imagen").value = galeriaArray[0];
  actualizarPreviewPrincipal();
}

// 🔥 SUBIR IMAGEN
async function subirImagen(file){
  if(!TOKEN){
    alert("Logueate primero");
    return;
  }

  if(!file || !file.type || !file.type.startsWith("image/")){
    alert("Solo se permiten imágenes.");
    return;
  }

  try{
    mostrarEstado("info", "Subiendo imagen...");

    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch(API + "/upload", {
      method:"POST",
      headers:{ Authorization:"Bearer " + TOKEN },
      body:formData
    });

    if(!res.ok){
      const text = await res.text();
      console.error(text);
      mostrarEstado("err", "❌ Error al subir imagen");
      alert("❌ Error upload");
      return;
    }

    const data = await res.json();

    if(data.url){
      galeriaArray.push(data.url);

      if(!document.getElementById("imagen").value.trim()){
        document.getElementById("imagen").value = data.url;
      }

      actualizarGaleria();
      actualizarPreviewPrincipal();

      document.execCommand("insertHTML", false, `<img src="${data.url}" style="max-width:100%;border-radius:8px;margin:10px 0;">`);

      mostrarEstado("ok", "✅ Imagen subida correctamente");
    }else{
      mostrarEstado("err", "❌ El servidor no devolvió URL");
    }

  }catch(err){
    console.error(err);
    mostrarEstado("err", "❌ Fallo en la subida");
    alert("❌ Fallo subida");
  }
}

// 🔥 ELIMINAR IMAGEN
function eliminarImagen(url){
  galeriaArray = galeriaArray.filter(img => img !== url);

  if(document.getElementById("imagen").value === url){
    document.getElementById("imagen").value = galeriaArray[0] || "";
    actualizarPreviewPrincipal();
  }

  actualizarGaleria();
}

// GALERIA
function actualizarGaleria(){
  document.getElementById("gallery").innerHTML =
    galeriaArray.map(u=>`
      <div class="img-box">
        <img src="${u}">
        <div class="delete-img" onclick="eliminarImagen('${u.replace(/'/g,"&#39;")}')">✕</div>
      </div>
    `).join("");
}

// PEGADO
document.addEventListener("paste", e=>{
  const items = e.clipboardData?.items;
  if(!items) return;

  for(const item of items){
    if(item.type && item.type.includes("image")){
      e.preventDefault();
      subirImagen(item.getAsFile());
    }
  }
});

// DRAG
const dropZone = document.getElementById("dropZone");
dropZone.ondrop = e=>{
  e.preventDefault();
  dropZone.classList.remove("dragover");
  for(const file of e.dataTransfer.files) subirImagen(file);
};
dropZone.ondragover = e=>{
  e.preventDefault();
  dropZone.classList.add("dragover");
};
dropZone.ondragleave = ()=>{
  dropZone.classList.remove("dragover");
};

// FILE
document.getElementById("fileInput").onchange = e=>{
  for(const file of e.target.files) subirImagen(file);
};

dropZone.onclick = ()=>document.getElementById("fileInput").click();

document.getElementById("imagen").addEventListener("input", actualizarPreviewPrincipal);

// CRUD
async function cargarNoticias(){
  try{
    mostrarEstado("info", "Cargando noticias...");

    const res = await fetch(API + "/noticias");
    const data = await res.json();

    noticiasCache = Array.isArray(data) ? data : [];
    renderNoticias(noticiasCache);

    mostrarEstado("ok", "✅ Noticias cargadas");
  }catch(err){
    console.error(err);
    mostrarEstado("err", "No se pudieron cargar las noticias.");
    document.getElementById("newsBox").innerHTML = `<div class="empty-box">No se pudieron cargar las noticias.</div>`;
  }
}

function formatearFecha(fecha){
  if(!fecha) return "Sin fecha";

  if(typeof fecha === "string"){
    const soloFecha = fecha.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(soloFecha){
      const anio = Number(soloFecha[1]);
      const mes = Number(soloFecha[2]) - 1;
      const dia = Number(soloFecha[3]);
      return new Date(anio, mes, dia, 12, 0, 0).toLocaleDateString("es-AR",{day:"numeric",month:"short",year:"numeric"});
    }
  }

  const f = new Date(fecha);
  if(isNaN(f.getTime())) return String(fecha);

  return f.toLocaleDateString("es-AR",{day:"numeric",month:"short",year:"numeric"});
}

function renderNoticias(lista){
  const box = document.getElementById("newsBox");

  if(!lista || !lista.length){
    box.innerHTML = `<div class="empty-box">No hay noticias para mostrar.</div>`;
    return;
  }

  box.innerHTML = lista.map(n=>`
    <div class="news-wrapper">
      <div class="news-card" style="background-image:url('${n.imagen || ""}')"></div>
      <div class="news-title">${escapeHtml(n.titulo || "Sin título")}</div>
      <div class="news-meta">
        ${escapeHtml(n.categoria || "General")} · ${escapeHtml(n.autor || "Redacción Apophis")}<br>
        ${escapeHtml(formatearFecha(n.fecha))}
      </div>
      <div class="news-actions">
        <button onclick="editarNoticiaPorId('${n._id}')">Editar</button>
        <button onclick="borrarNoticia('${n._id}')">Borrar</button>
      </div>
    </div>
  `).join("");
}

function editarNoticiaPorId(id){
  const n = noticiasCache.find(item => item._id === id);
  if(!n){
    alert("No se encontró la noticia.");
    return;
  }
  editarNoticia(n);
}

function normalizarFechaInput(fecha){
  if(!fecha) return "";

  if(typeof fecha === "string"){
    const soloFecha = fecha.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(soloFecha){
      return `${soloFecha[1]}-${soloFecha[2]}-${soloFecha[3]}`;
    }
  }

  const f = new Date(fecha);
  if(isNaN(f.getTime())) return "";

  const anio = f.getFullYear();
  const mes = String(f.getMonth()+1).padStart(2,"0");
  const dia = String(f.getDate()).padStart(2,"0");
  return `${anio}-${mes}-${dia}`;
}

function editarNoticia(n){
  document.getElementById("noticiaId").value = n._id || "";
  document.getElementById("titulo").value = n.titulo || "";
  document.getElementById("autor").value = n.autor || "";
  document.getElementById("fecha").value = normalizarFechaInput(n.fecha);
  document.getElementById("textoEditor").innerHTML = n.contenido || "";
  document.getElementById("categoria").value = n.categoria || "Politica";
  document.getElementById("imagen").value = n.imagen || "";

  galeriaArray = Array.isArray(n.imagenes) ? [...n.imagenes] : (n.imagen ? [n.imagen] : []);
  actualizarGaleria();
  actualizarPreviewPrincipal();

  window.scrollTo({top:0, behavior:"smooth"});
  mostrarEstado("info", "Editando noticia seleccionada");
}

async function borrarNoticia(id){
  if(!TOKEN){
    alert("Debés iniciar sesión primero.");
    return;
  }

  if(!confirm("¿Seguro que querés borrar esta noticia?")){
    return;
  }

  try{
    mostrarEstado("info", "Borrando noticia...");

    const res = await fetch(API + "/noticias/" + id, {
      method:"DELETE",
      headers:{ Authorization:"Bearer " + TOKEN }
    });

    if(!res.ok){
      throw new Error("No se pudo borrar");
    }

    mostrarEstado("ok", "🗑 Noticia eliminada");
    cargarNoticias();
  }catch(err){
    console.error(err);
    mostrarEstado("err", "No se pudo borrar la noticia.");
    alert("❌ No se pudo borrar");
  }
}

function validarFormulario(){
  const titulo = document.getElementById("titulo").value.trim();
  const contenido = document.getElementById("textoEditor").innerHTML.trim();
  const categoria = document.getElementById("categoria").value.trim();
  const imagen = document.getElementById("imagen").value.trim();

  if(!titulo){
    alert("Falta el título.");
    return false;
  }

  if(contenido === "" || contenido === "<br>" || contenido === "<div><br></div>"){
    alert("Falta el contenido.");
    return false;
  }

  if(!categoria){
    alert("Falta la categoría.");
    return false;
  }

  if(!imagen){
    alert("Falta la imagen principal.");
    return false;
  }

  return true;
}

async function guardarNoticia(){
  if(!TOKEN){
    alert("Debés iniciar sesión primero.");
    return;
  }

  if(!validarFormulario()) return;

  setLoadingBoton("btnGuardar", true, "💾 Guardar", "Guardando...");

  try{
    const id = document.getElementById("noticiaId").value.trim();

    const body = {
      titulo: document.getElementById("titulo").value.trim(),
      autor: document.getElementById("autor").value.trim() || "Redacción Apophis",
      fecha: document.getElementById("fecha").value || new Date().toISOString().slice(0,10),
      contenido: document.getElementById("textoEditor").innerHTML,
      categoria: document.getElementById("categoria").value,
      imagen: document.getElementById("imagen").value.trim(),
      imagenes: galeriaArray
    };

    let res;

    if(id){
      res = await fetch(API + "/noticias/" + id, {
        method:"PUT",
        headers:{
          "Content-Type":"application/json",
          Authorization:"Bearer " + TOKEN
        },
        body:JSON.stringify(body)
      });
    }else{
      res = await fetch(API + "/noticias", {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          Authorization:"Bearer " + TOKEN
        },
        body:JSON.stringify(body)
      });
    }

    if(!res.ok){
      const text = await res.text();
      console.error(text);
      throw new Error("No se pudo guardar");
    }

    mostrarEstado("ok", "✅ Guardado correctamente");
    alert("✅ Guardado");
    nuevaNoticia();
    cargarNoticias();

  }catch(err){
    console.error(err);
    mostrarEstado("err", "No se pudo guardar la noticia.");
    alert("❌ Error al guardar");
  }finally{
    setLoadingBoton("btnGuardar", false, "💾 Guardar", "Guardando...");
  }
}

function escapeHtml(text){
  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function activarBuscadorNoticias(){
  const input = document.getElementById("buscadorNoticias");

  input.addEventListener("input", function(){
    const q = input.value.trim().toLowerCase();

    if(!q){
      renderNoticias(noticiasCache);
      return;
    }

    const filtradas = noticiasCache.filter(n =>
      String(n.titulo || "").toLowerCase().includes(q) ||
      String(n.categoria || "").toLowerCase().includes(q) ||
      String(n.autor || "").toLowerCase().includes(q) ||
      String(n.contenido || "").toLowerCase().includes(q)
    );

    renderNoticias(filtradas);
  });
}

window.onload = ()=>{
  aplicarDarkMode();
  restaurarToken();
  actualizarPreviewPrincipal();
  activarBuscadorNoticias();
  if(TOKEN){
    cargarNoticias();
    mostrarEstado("ok", "✅ Sesión restaurada");
  }else{
    loginAdmin();
  }
};
