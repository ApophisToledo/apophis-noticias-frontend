<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin - Apophis Noticias</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{margin:0;font-family:Georgia;background:#f4e3b2;color:#111;transition:.3s;}
body.dark{background:#111;color:#f0e68c;}
.header{background:black;color:gold;padding:25px;display:flex;justify-content:center;align-items:center;gap:10px;}
.container{max-width:1000px;margin:20px auto;padding:20px;background:rgba(255,255,255,0.95);border-radius:12px;}
.container.dark{background:rgba(0,0,0,0.85);color:#f0e68c;}

input, select, textarea{width:100%;padding:8px;margin:5px 0;border-radius:6px;border:1px solid #111;}

button{padding:8px 12px;margin-top:5px;border:none;border-radius:8px;background:#111;color:gold;cursor:pointer;font-weight:bold;}

.news-box{display:flex;flex-wrap:wrap;gap:15px;margin-top:20px;}

.news-card{
  width:220px;height:150px;
  background-size:cover;background-position:center;
  border-radius:8px;
}

/* ✅ NUEVO */
.news-wrapper{width:220px;}
.news-actions{display:flex;justify-content:space-between;margin-top:5px;}

.news-title{
  font-weight:bold;
  text-align:center;
  margin-top:5px;
}

.edit-btn{background:gold;color:black;}
.delete-btn{background:red;color:white;}
</style>
</head>

<body>

<div class="header">
  <span>ADMIN - APOPHIS NOTICIAS</span>
</div>

<div class="container">
  <h2>Crear / Editar Noticia</h2>

  <input type="hidden" id="noticiaId">
  <input type="text" id="titulo" placeholder="Título">

  <div contenteditable="true" id="textoEditor" style="min-height:150px;border:1px solid #111;"></div>

  <select id="categoria">
    <option value="Politica">Política</option>
    <option value="Deportes">Deportes</option>
  </select>

  <div contenteditable="true" id="imagenEditor"></div>

  <button onclick="guardarNoticia()">Guardar</button>

  <h2>Noticias existentes</h2>
  <div id="newsBox" class="news-box"></div>
</div>

<script>
const API="https://apophis-noticias-backend.vercel.app";
let TOKEN="";

async function loginAdmin(){
  const user=prompt("Usuario:");
  const pass=prompt("Pass:");
  const res = await fetch(API+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user,pass})});
  const data=await res.json();
  TOKEN=data.token;
}
loginAdmin();

async function cargarNoticias(){
  const res=await fetch(API+"/noticias");
  const noticias=await res.json();
  const box=document.getElementById("newsBox");
  box.innerHTML="";

  noticias.forEach(n=>{
    const wrapper=document.createElement("div");
    wrapper.className="news-wrapper";

    const card=document.createElement("div");
    card.className="news-card";
    card.style.backgroundImage=`url('${n.imagen}')`;

    const title=document.createElement("div");
    title.className="news-title";
    title.textContent=n.titulo;

    const actions=document.createElement("div");
    actions.className="news-actions";

    const editBtn=document.createElement("button");
    editBtn.className="edit-btn";
    editBtn.textContent="Editar";
    editBtn.onclick=()=>editarNoticia(n);

    const deleteBtn=document.createElement("button");
    deleteBtn.className="delete-btn";
    deleteBtn.textContent="Borrar";
    deleteBtn.onclick=()=>borrarNoticia(n._id);

    actions.appendChild(editBtn);
    actions.appendChild(deleteBtn);

    wrapper.appendChild(card);
    wrapper.appendChild(title);
    wrapper.appendChild(actions);

    box.appendChild(wrapper);
  });
}

function editarNoticia(n){
  document.getElementById("noticiaId").value=n._id;
  document.getElementById("titulo").value=n.titulo;
  document.getElementById("textoEditor").innerHTML=n.contenido;
}

async function borrarNoticia(id){
  await fetch(API+"/noticias/"+id,{method:"DELETE",headers:{Authorization:"Bearer "+TOKEN}});
  cargarNoticias();
}

async function guardarNoticia(){
  const id=document.getElementById("noticiaId").value;
  const body={
    titulo:document.getElementById("titulo").value,
    contenido:document.getElementById("textoEditor").innerHTML
  };

  if(id){
    await fetch(API+"/noticias/"+id,{method:"PUT",headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},body:JSON.stringify(body)});
  }else{
    await fetch(API+"/noticias",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},body:JSON.stringify(body)});
  }

  cargarNoticias();
}

window.onload=cargarNoticias;
</script>

</body>
</html>
