<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin - Apophis Noticias PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{margin:0;font-family:Georgia;background:#f4e3b2;color:#111;}
.header{background:black;color:gold;padding:25px;display:flex;justify-content:center;}
.container{max-width:1000px;margin:20px auto;padding:20px;background:white;border-radius:12px;}

.toolbar{display:flex;gap:5px;margin-bottom:5px;}
.toolbar button{background:gold;color:black;font-size:12px;}

input, select{width:100%;padding:8px;margin:5px 0;border-radius:6px;border:1px solid #111;}
button{padding:8px 12px;margin-top:5px;border:none;border-radius:8px;background:#111;color:gold;cursor:pointer;font-weight:bold;}

.news-box{display:flex;flex-wrap:wrap;gap:15px;margin-top:20px;}
.news-card{width:220px;height:150px;background-size:cover;border-radius:8px;}
.news-wrapper{width:220px;}
.news-actions{display:flex;justify-content:space-between;margin-top:5px;}
.news-title{text-align:center;font-weight:bold;margin-top:5px;}

.drop-zone{
  border:2px dashed #111;
  padding:20px;
  text-align:center;
  margin:10px 0;
  border-radius:10px;
  background:#fafafa;
  cursor:pointer;
}
.drop-zone.dragover{background:#ffe;}

.edit-btn{background:gold;color:black;}
.delete-btn{background:red;color:white;}

.gallery{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.gallery img{width:100px;height:70px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid #111;}
</style>
</head>

<body>

<div class="header">
  <span>ADMIN - APOPHIS NOTICIAS PRO</span>
</div>

<div class="container">

<h2>Crear / Editar Noticia</h2>

<button onclick="nuevaNoticia()">➕ Nueva noticia</button>

<input type="hidden" id="noticiaId">
<input type="text" id="titulo" placeholder="Título">

<div class="toolbar">
  <button onclick="format('bold')">B</button>
  <button onclick="format('italic')">I</button>
  <button onclick="format('underline')">U</button>
</div>

<div contenteditable="true" id="textoEditor"
style="min-height:200px;border:1px solid #111;padding:10px;background:white;"></div>

<select id="categoria">
  <option value="Politica">Política</option>
  <option value="Deportes">Deportes</option>
  <option value="Policiales">Policiales</option>
  <option value="Arte">Arte</option>
  <option value="Show">Show</option>
  <option value="Pais">País</option>
  <option value="Mundo">Mundo</option>
  <option value="Ciudad">Ciudad</option>
</select>

<input type="text" id="imagen" placeholder="URL o pegar imagen">

<div id="dropZone" class="drop-zone">
📸 Arrastrá, pegá (CTRL+V), o hacé click
</div>

<input type="file" id="fileInput" multiple style="display:none;">

<h3>Galería</h3>
<div class="gallery" id="gallery"></div>

<button onclick="guardarNoticia()">Guardar</button>

<h2>Noticias existentes</h2>
<div id="newsBox" class="news-box"></div>

</div>

<script>
const API="https://apophis-noticias-backend.vercel.app";
let TOKEN="";
let galeriaArray=[];

// LOGIN
async function loginAdmin(){
  const user=prompt("Usuario:");
  const pass=prompt("Pass:");

  const res=await fetch(API+"/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({user,pass})
  });

  const data=await res.json();
  if(!data.token){alert("❌ Login incorrecto"); return loginAdmin();}
  TOKEN=data.token;
  cargarNoticias();
}
loginAdmin();

// EDITOR
function format(cmd){document.execCommand(cmd,false,null);}

// NUEVA NOTICIA
function nuevaNoticia(){
  document.getElementById("noticiaId").value="";
  document.getElementById("titulo").value="";
  document.getElementById("textoEditor").innerHTML="";
  document.getElementById("imagen").value="";
  galeriaArray=[];
  actualizarGaleria();
}

// SUBIR IMAGEN
async function subirImagen(file){
  const formData = new FormData();
  formData.append("file", file);

  const res = await fetch(API + "/upload", {
    method: "POST",
    headers: { Authorization: "Bearer " + TOKEN },
    body: formData
  });

  const data = await res.json();
  if(data.url){
    galeriaArray.push(data.url);
    document.getElementById("imagen").value = data.url;
    actualizarGaleria();

    const imgHTML = `<img src="${data.url}" style="max-width:100%;margin:10px 0;">`;
    document.execCommand("insertHTML", false, imgHTML);
  }
}

// ACTUALIZAR GALERÍA
function actualizarGaleria(){
  const g = document.getElementById("gallery");
  g.innerHTML = galeriaArray.map(u=>`<img src="${u}" onclick="removerImagen('${u}')">`).join("");
}

function removerImagen(u){
  galeriaArray = galeriaArray.filter(i=>i!==u);
  actualizarGaleria();
}

// PEGADO UNIVERSAL (clipboard + URL)
async function manejarPaste(e){
  if(e.clipboardData){
    for (let item of e.clipboardData.items){
      if(item.type.indexOf("image")!==-1){
        e.preventDefault();
        subirImagen(item.getAsFile());
        return;
      }
    }
    // URL
    const text = e.clipboardData.getData("text");
    if(text && text.match(/\.(jpeg|jpg|gif|png|webp)$/i)){
      e.preventDefault();
      try{
        const res = await fetch(text);
        const blob = await res.blob();
        const file = new File([blob],"imagen.jpg",{type:blob.type});
        subirImagen(file);
      }catch(err){alert("⚠️ No se pudo subir la imagen desde URL");}
    }
  }
}

// EVENTOS PEGADO
document.addEventListener("paste", manejarPaste);
document.getElementById("imagen").addEventListener("paste", manejarPaste);
document.getElementById("textoEditor").addEventListener("paste", manejarPaste);

// DRAG & DROP
const dropZone = document.getElementById("dropZone");
dropZone.addEventListener("dragover", e=>{e.preventDefault(); dropZone.classList.add("dragover");});
dropZone.addEventListener("dragleave", ()=>{dropZone.classList.remove("dragover");});
dropZone.addEventListener("drop", e=>{
  e.preventDefault(); dropZone.classList.remove("dragover");
  for(const file of e.dataTransfer.files) subirImagen(file);
});
dropZone.onclick = ()=> document.getElementById("fileInput").click();
document.getElementById("fileInput").addEventListener("change", e=>{
  for(const file of e.target.files) subirImagen(file);
});

// CARGAR NOTICIAS
async function cargarNoticias(){
  const res = await fetch(API+"/noticias");
  const noticias = await res.json();
  const box = document.getElementById("newsBox");
  box.innerHTML="";

  noticias.forEach(n=>{
    const wrapper = document.createElement("div");
    wrapper.className="news-wrapper";
    wrapper.innerHTML=`
      <div class="news-card" style="background-image:url('${n.imagen}')"></div>
      <div class="news-title">${n.titulo}</div>
      <div class="news-actions">
        <button class="edit-btn" onclick='editarNoticia(${JSON.stringify(n)})'>Editar</button>
        <button class="delete-btn" onclick="borrarNoticia('${n._id}')">Borrar</button>
      </div>
    `;
    box.appendChild(wrapper);
  });
}

// EDITAR
function editarNoticia(n){
  document.getElementById("noticiaId").value=n._id;
  document.getElementById("titulo").value=n.titulo;
  document.getElementById("textoEditor").innerHTML=n.contenido;
  document.getElementById("categoria").value=n.categoria;
  document.getElementById("imagen").value=n.imagen;
  galeriaArray = n.galeria || [];
  actualizarGaleria();
}

// BORRAR
async function borrarNoticia(id){
  await fetch(API+"/noticias/"+id,{
    method:"DELETE",
    headers:{Authorization:"Bearer "+TOKEN}
  });
  cargarNoticias();
}

// GUARDAR
async function guardarNoticia(){
  const id = document.getElementById("noticiaId").value;
  const body = {
    titulo: document.getElementById("titulo").value,
    contenido: document.getElementById("textoEditor").innerHTML,
    categoria: document.getElementById("categoria").value,
    imagen: document.getElementById("imagen").value,
    galeria: galeriaArray
  };

  if(id){
    await fetch(API+"/noticias/"+id,{
      method:"PUT",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+TOKEN
      },
      body:JSON.stringify(body)
    });
  }else{
    await fetch(API+"/noticias",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+TOKEN
      },
      body:JSON.stringify(body)
    });
  }

  alert("✅ Guardado");
  nuevaNoticia();
  cargarNoticias();
}
</script>

</body>
</html>
