<script>
const API="https://apophis-noticias-backend.vercel.app";
let noticiaId="";

function aplicarDarkMode(){
  let dark = localStorage.getItem("darkMode");
  if(dark === null){
    dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  }else{
    dark = dark === "true";
  }
  document.body.classList.toggle("dark", dark);
  const btn = document.getElementById("darkBtn");
  if(btn) btn.innerText = dark ? "☀️" : "🌙";
}

function toggleDark(){
  const activo = document.body.classList.toggle("dark");
  localStorage.setItem("darkMode", activo);
  const btn = document.getElementById("darkBtn");
  if(btn) btn.innerText = activo ? "☀️" : "🌙";
}

function verCat(c){
  location="categoria.html?cat="+encodeURIComponent(c);
}

function parseFechaSegura(fecha){
  if(!fecha) return null;

  if(fecha instanceof Date && !isNaN(fecha.getTime())){
    return fecha;
  }

  if(typeof fecha === "string"){
    const limpia = fecha.trim();

    const soloFecha = /^(\d{4})-(\d{2})-(\d{2})$/;
    const matchSoloFecha = limpia.match(soloFecha);
    if(matchSoloFecha){
      const anio = Number(matchSoloFecha[1]);
      const mes = Number(matchSoloFecha[2]) - 1;
      const dia = Number(matchSoloFecha[3]);
      return new Date(anio, mes, dia, 12, 0, 0);
    }

    const parseada = new Date(limpia);
    if(!isNaN(parseada.getTime())){
      return parseada;
    }
  }

  return null;
}

function formatearFecha(fecha){
  const f = parseFechaSegura(fecha);
  if(f){
    return f.toLocaleDateString("es-AR",{day:"numeric",month:"long",year:"numeric"});
  }

  if(typeof fecha === "string" && fecha.trim()){
    return fecha;
  }

  return "Fecha no disponible";
}

function formatearFechaHora(fecha){
  const f = parseFechaSegura(fecha);
  if(f){
    return f.toLocaleDateString("es-AR",{day:"numeric",month:"long",year:"numeric"}) + " · " +
           f.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  }

  if(typeof fecha === "string" && fecha.trim()){
    return fecha;
  }

  return "Hace instantes";
}

function escaparHTML(texto){
  if(texto === undefined || texto === null) return "";
  return String(texto)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function nl2brSeguro(texto){
  return escaparHTML(texto).replace(/\n/g,"<br>");
}

function actualizarSEO(n){
  const titulo = n && n.titulo ? n.titulo + " | Apophis Noticias" : "Apophis Noticias";
  const descripcionBase = n && n.contenido ? String(n.contenido).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim() : "Noticias actualizadas";
  const descripcion = descripcionBase.slice(0, 160) || "Noticias actualizadas";
  const url = location.href;
  const imagen = n && n.imagen ? n.imagen : "";

  document.getElementById("metaTitle").innerText = titulo;
  document.title = titulo;

  document.getElementById("ogTitle").setAttribute("content", titulo);
  document.getElementById("ogDesc").setAttribute("content", descripcion);
  document.getElementById("ogUrl").setAttribute("content", url);
  document.getElementById("ogImg").setAttribute("content", imagen);
}

    document.getElementById("btnEnojo")
  ];

  botones.forEach(btn=>{
    if(!btn) return;
    btn.disabled = yaReacciono;
    btn.classList.toggle("bloqueada", yaReacciono);
  });
}

async function buscarNoticias(texto){
  const res = await fetch(API + "/noticias");
  if(!res.ok) throw new Error("Error de búsqueda");

  const data = await res.json();
  const q = texto.trim().toLowerCase();
  if(!q) return null;

  const exacta = data.find(n =>
    (n.titulo || "").toLowerCase().includes(q) ||
    (n.categoria || "").toLowerCase().includes(q) ||
    String(n.contenido || "").toLowerCase().includes(q)
  );

  return exacta || null;
}

function renderComentarios(comentarios){
  const lista = document.getElementById("listaComentarios");

  if(!comentarios.length){
    lista.innerHTML = `<div class="sin-comentarios">Todavía no hay comentarios. Sé el primero en participar.</div>`;
    return;
  }

  lista.innerHTML = comentarios.map((c,i)=>`
    <div class="comentario">
      <div class="comentario-head">
        <strong>${escaparHTML(c.nombre || "Anónimo")}</strong>
        <span class="comentario-fecha">${escaparHTML(formatearFechaHora(c.fecha))}</span>
      </div>

      <div class="comentario-texto">${nl2brSeguro(c.texto || "")}</div>

      <div class="responder-box">
        <input id="respNombre${i}" placeholder="Tu nombre">
        <input id="respTexto${i}" placeholder="Responder...">
        <button onclick="responder(${i})">Responder</button>
      </div>

      ${Array.isArray(c.respuestas) && c.respuestas.length ? c.respuestas.map(r=>`
        <div class="respuesta">
          <strong>${escaparHTML(r.nombre || "Anónimo")}</strong>
          ${r.fecha ? `<span style="opacity:.75"> · ${escaparHTML(formatearFechaHora(r.fecha))}</span>` : ""}
          <div style="margin-top:4px;">${nl2brSeguro(r.texto || "")}</div>
        </div>
      `).join("") : ""}
    </div>
  `).join("");
}

function renderNoticia(n){
  noticiaActual = n;

  actualizarSEO(n);

  const autor = n.autor ? n.autor : "Redacción Apophis";
  const fechaMostrada = formatearFecha(n.fecha || n.createdAt);
  const categoria = n.categoria ? n.categoria : "General";
  const contenidoSeguro = String(n.contenido || "");

  document.getElementById("noticiaContainer").innerHTML = `
    <div class="noticia-box">
      <h1 class="noticia-titulo">${escaparHTML(n.titulo || "Sin título")}</h1>

      <div class="noticia-meta">
        <span class="meta-pill">🗓 ${escaparHTML(fechaMostrada)}</span>
        <span class="meta-pill">✍️ ${escaparHTML(autor)}</span>
        <span class="meta-pill">📰 <a class="categoria-link" href="categoria.html?cat=${encodeURIComponent(categoria)}">${escaparHTML(categoria)}</a></span>
      </div>

      ${n.imagen ? `<img alt="Imagen Apophis" src="${escaparHTML(n.imagen)}" alt="${escaparHTML(n.titulo || "Imagen de la noticia")}" class="noticia-imagen">` : ""}

      <div class="noticia-contenido">${contenidoSeguro}</div>
    </div>
  `;

  actualizarContadoresReacciones(n);
  actualizarEstadoBotonesReaccion();

  const comentarios = Array.isArray(n.comentarios) ? [...n.comentarios] : [];
  comentarios.sort((a,b)=>{
    const fa = parseFechaSegura(a && a.fecha);
    const fb = parseFechaSegura(b && b.fecha);
    return (fb ? fb.getTime() : 0) - (fa ? fa.getTime() : 0);
  });

  renderComentarios(comentarios);
}

async function cargarRelacionadas(n){
  try{
    const rel = await fetch(API + "/noticias/categoria/" + encodeURIComponent(n.categoria || ""));
    if(!rel.ok) throw new Error("Error relacionadas");

    const dataRel = await rel.json();

    const relacionadasFiltradas = Array.isArray(dataRel)
      ? dataRel.filter(r => r && r._id !== n._id).slice(0, 8)
      : [];

    if(!relacionadasFiltradas.length){
      document.getElementById("relacionadas").innerHTML = `<div class="rel-vacio">No hay noticias relacionadas disponibles.</div>`;
    }else{
      document.getElementById("relacionadas").innerHTML = relacionadasFiltradas.map(r=>`
        <div class="rel-card" style="background-image:url('${escaparHTML(r.imagen || "")}')" onclick="ir('${r._id}')">
          <span>${escaparHTML(r.titulo || "Sin título")}</span>
        </div>
      `).join("");
    }
  }catch(e){
    document.getElementById("relacionadas").innerHTML = `<div class="rel-vacio">No se pudieron cargar las relacionadas.</div>`;
  }
}

async function cargarNoticia(){
  try{
    const id = new URLSearchParams(location.search).get("id");
    noticiaId = id;

    if(!id){
      document.getElementById("noticiaContainer").innerHTML = `
        <div class="mensaje-estado">No se encontró la noticia solicitada.</div>
      `;
      document.getElementById("relacionadas").innerHTML = `
        <div class="rel-vacio">No hay noticias relacionadas.</div>
      `;
      document.getElementById("listaComentarios").innerHTML = `
        <div class="sin-comentarios">Todavía no hay comentarios.</div>
      `;
      return;
    }

    const res = await fetch(API + "/noticias/" + id);
    if(!res.ok) throw new Error("No se pudo cargar la noticia");

    const n = await res.json();

    renderNoticia(n);
    await cargarRelacionadas(n);
    activarAds();

  }catch(e){
    document.getElementById("noticiaContainer").innerHTML = `
      <div class="mensaje-estado">No se pudo cargar la noticia en este momento.</div>
    `;
    document.getElementById("relacionadas").innerHTML = `
      <div class="rel-vacio">No hay noticias relacionadas.</div>
    `;
    document.getElementById("listaComentarios").innerHTML = `
      <div class="sin-comentarios">No se pudieron cargar los comentarios.</div>
    `;
  }
}

async function reaccion(tipo){
  if(!noticiaId || !noticiaActual){
    alert("No se pudo identificar la noticia.");
    return;
  }

  const key = "react_" + noticiaId;

  if(localStorage.getItem(key)){
    alert("Ya reaccionaste");
    return;
  }

  const respaldo = { ...noticiaActual };

  try{
    noticiaActual[tipo] = Number(noticiaActual[tipo] || 0) + 1;
    actualizarContadoresReacciones(noticiaActual);

    localStorage.setItem(key, "true");
    actualizarEstadoBotonesReaccion();

    const res = await fetch(API + "/noticias/" + noticiaId,{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({[tipo]:1})
    });

    if(!res.ok){
      throw new Error("Error al guardar reacción");
    }

    const actualizada = await res.json();
    noticiaActual = actualizada;
    actualizarContadoresReacciones(actualizada);
    actualizarEstadoBotonesReaccion();

  }catch(e){
    noticiaActual = respaldo;
    actualizarContadoresReacciones(respaldo);
    localStorage.removeItem(key);
    actualizarEstadoBotonesReaccion();
    alert("No se pudo registrar la reacción.");
  }
}

async function enviarComentario(){
  const nombre = document.getElementById("nombreComentario").value.trim();
  const texto = document.getElementById("textoComentario").value.trim();

  if(!nombre || !texto){
    alert("Completá nombre y comentario.");
    return;
  }

  if(texto.length < 3){
    alert("El comentario es demasiado corto.");
    return;
  }

  if(!antiSpamPermitido("comentario_antispam_" + noticiaId, 20)){
    alert("Esperá unos segundos antes de volver a comentar.");
    return;
  }

  try{
    const res = await fetch(API + "/comentario/" + noticiaId,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({nombre,texto})
    });

    if(!res.ok){
      throw new Error("No se pudo enviar");
    }

    document.getElementById("textoComentario").value = "";
    await cargarNoticia();
  }catch(e){
    alert("No se pudo enviar el comentario.");
  }
}

async function responder(i){
  const nombre = document.getElementById("respNombre"+i).value.trim();
  const texto = document.getElementById("respTexto"+i).value.trim();

  if(!nombre || !texto){
    alert("Completá nombre y respuesta.");
    return;
  }

  if(texto.length < 2){
    alert("La respuesta es demasiado corta.");
    return;
  }

  if(!antiSpamPermitido("respuesta_antispam_" + noticiaId + "_" + i, 15)){
    alert("Esperá unos segundos antes de volver a responder.");
    return;
  }

  try{
    const res = await fetch(API + "/respuesta/" + noticiaId + "/" + i,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({nombre,texto})
    });

    if(!res.ok){
      throw new Error("No se pudo responder");
    }

    await cargarNoticia();
  }catch(e){
    alert("No se pudo enviar la respuesta.");
  }
}

function activarBuscador(){
  const buscador = document.getElementById("buscador");
  if(!buscador) return;

  buscador.addEventListener("keydown", async function(e){
    if(e.key === "Enter"){
      const valor = buscador.value.trim();
      if(!valor) return;

      try{
        const encontrada = await buscarNoticias(valor);
        if(encontrada && encontrada._id){
          ir(encontrada._id);
        }else{
          alert("No se encontraron noticias con esa búsqueda.");
        }
      }catch(err){
        alert("No se pudo realizar la búsqueda.");
      }
    }
  });
}

window.onload = () => {
  aplicarDarkMode();
  activarBuscador();
  cargarNoticia();
};
