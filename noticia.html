<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="metaTitle">Categoría - Apophis Noticias</title>

<meta name="description" id="metaDesc" content="Noticias por categoría en Apophis Noticias">
<meta name="robots" content="index, follow">

<meta property="og:title" id="ogTitle">
<meta property="og:description" id="ogDesc">
<meta property="og:type" content="website">
<meta property="og:url" id="ogUrl">
<meta property="og:image" id="ogImg">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6641245592697930" crossorigin="anonymous"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
  margin:0;
  font-family:Georgia;
  background:#f4e3b2;
  color:#111;
}
body.dark{
  background:#111;
  color:#f0e68c;
}

/* HEADER */
.header{
  background:black;
  color:gold;
  padding:18px;
  text-align:center;
  position:relative;
}

.logo{
  max-width:90%;
  height:auto;
  border-radius:10px;
  transition:.3s;
}
.logo:hover{
  transform:scale(1.05);
}

.dark-btn{
  position:absolute;
  right:10px;
  top:10px;
  background:#111;
  color:gold;
  border:none;
  padding:6px 10px;
  border-radius:8px;
}

/* NAV */
.nav{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  padding:10px;
}

.cat-btn, .volver-btn{
  background:#111;
  color:gold;
  border:none;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
}

/* FLAYER */
.flayer{
  overflow:hidden;
  margin:15px;
}
.track{
  display:flex;
  gap:10px;
  animation:scroll 30s linear infinite;
}
.item{
  min-width:200px;
  height:120px;
  border-radius:10px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
}
.item img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.item span{
  position:absolute;
  bottom:0;
  width:100%;
  background:rgba(0,0,0,.8);
  color:gold;
  font-size:12px;
  padding:5px;
}

@keyframes scroll{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.card{
  height:220px;
  border-radius:12px;
  background-size:cover;
  background-position:center;
  position:relative;
  cursor:pointer;
}
.card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.8), transparent);
}
.card h3{
  position:absolute;
  bottom:10px;
  left:10px;
  right:10px;
  color:gold;
  background:rgba(0,0,0,.7);
  padding:6px;
  border-radius:6px;
  font-size:14px;
}

/* MOBILE */
@media(max-width:700px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <img src="658175444_25680405581633658_3668668824201018733_n.jpg" class="logo" onclick="location.href='index.html'">
  <button class="dark-btn" onclick="toggleDark()">🌙</button>
</div>

<!-- NAV -->
<div class="nav">
  <button class="volver-btn" onclick="location.href='index.html'">🏠</button>
  <button class="cat-btn" onclick="verCat('Politica')">Política</button>
  <button class="cat-btn" onclick="verCat('Deportes')">Deportes</button>
  <button class="cat-btn" onclick="verCat('Policiales')">Policiales</button>
  <button class="cat-btn" onclick="verCat('Arte')">Arte</button>
  <button class="cat-btn" onclick="verCat('Show')">Show</button>
  <button class="cat-btn" onclick="verCat('Pais')">País</button>
  <button class="cat-btn" onclick="verCat('Mundo')">Mundo</button>
  <button class="cat-btn" onclick="verCat('Ciudad')">Ciudad</button>
</div>

<h1 id="titulo" style="text-align:center;"></h1>

<!-- FLAYER -->
<div class="flayer">
  <div id="track" class="track"></div>
</div>

<!-- GRID -->
<div id="contenedor" class="grid"></div>

<footer style="text-align:center;background:#111;color:gold;padding:20px;">
  © 2026 Apophis Noticias |
  <a href="privacidad.html">Privacidad</a> |
  <a href="contacto.html">Contacto</a> |
  <a href="sobre.html">Sobre</a>
</footer>

<script>
const API="https://apophis-noticias-backend.vercel.app";

function toggleDark(){
  document.body.classList.toggle("dark");
}

function verCat(c){
  location="categoria.html?cat="+c;
}

function ir(id){
  location="noticia.html?id="+id;
}

async function cargar(){
  const cat=new URLSearchParams(location.search).get("cat");
  document.getElementById("titulo").innerText=cat;

  const res=await fetch(API+"/noticias/categoria/"+cat);
  const data=await res.json();

  // GRID SOLO CATEGORIA
  document.getElementById("contenedor").innerHTML=data.map(n=>`
    <div class="card" style="background-image:url('${n.imagen}')" onclick="ir('${n._id}')">
      <h3>${n.titulo}</h3>
    </div>
  `).join("");

  // FLAYER SOLO CATEGORIA
  const flayer=data.map(n=>`
    <div class="item" onclick="ir('${n._id}')">
      <img src="${n.imagen}">
      <span>${n.titulo}</span>
    </div>
  `).join("");

  document.getElementById("track").innerHTML=flayer+flayer;
}

cargar();
</script>

</body>
</html>
