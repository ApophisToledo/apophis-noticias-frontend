<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Apophis Noticias - Información actualizada de Argentina y el mundo">
<meta name="robots" content="index, follow">

<title id="metaTitle">Apophis Noticias</title>

<meta property="og:title" id="ogTitle" content="Apophis Noticias">
<meta property="og:description" id="ogDesc" content="Noticias actualizadas">
<meta property="og:type" content="article">
<meta property="og:url" id="ogUrl">
<meta property="og:image" id="ogImg">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6641245592697930" crossorigin="anonymous"></script>

<style>
body{margin:0;font-family:Georgia;background:#f4e3b2;color:#111;transition:.3s;}
body.dark{background:#111;color:#f0e68c;}

.layout{
  display:flex;
  max-width:1200px;
  margin:auto;
  gap:20px;
}

.noticia-container{
  flex:3;
  background:#fdf5d7;
  padding:20px;
  border-radius:12px;
}
body.dark .noticia-container{background:#1a1a1a;}

.relacionadas-lateral{
  flex:1;
}

.rel-card{
  height:100px;
  background-size:cover;
  border-radius:8px;
  margin-bottom:10px;
  cursor:pointer;
  position:relative;
}
.rel-card span{
  position:absolute;
  bottom:0;
  background:black;
  color:gold;
  width:100%;
  font-size:12px;
  padding:3px;
}

.reactions{
  display:flex;
  gap:5px;
  margin-top:15px;
  justify-content:center;
  flex-wrap:wrap;
}
.reactions button{
  background:#111;
  color:gold;
  padding:6px 10px;
  border-radius:6px;
}

.dark-toggle{
  position:fixed;
  top:10px;
  left:10px;
  background:#111;
  color:gold;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.buscador-box{text-align:center;margin:20px;}
#buscador{padding:10px;width:60%;border-radius:8px;}

.volver{text-align:center;margin:10px;}
.volver button{
  padding:8px 12px;
  border-radius:8px;
  background:#111;
  color:gold;
  cursor:pointer;
}

/* 💬 */
.comentarios{max-width:900px;margin:auto;margin-top:20px;}
.comentario{border-bottom:1px solid #ccc;margin:10px 0;padding:5px;}
.respuesta{margin-left:20px;font-size:0.9rem;}

footer{
  margin-top:40px;
  padding:20px;
  text-align:center;
  background:#111;
  color:gold;
}
footer a{color:gold;margin:0 10px;}
</style>
</head>

<body>

<div class="dark-toggle" onclick="toggleDark()">🌙</div>

<div class="volver">
  <button onclick="location.href='index.html'">🏠 Volver al inicio</button>
</div>

<div class="buscador-box">
  <input id="buscador" placeholder="🔍 Buscar noticias...">
</div>

<div class="layout">

<div class="noticia-container" id="noticiaContainer"></div>

<div class="relacionadas-lateral" id="relacionadas"></div>

</div>

<div class="reactions">
  <button onclick="reaccion('likes')">👍 <span id="likes">0</span></button>
  <button onclick="reaccion('dislikes')">👎 <span id="dislikes">0</span></button>
  <button onclick="reaccion('sorpresa')">😲 <span id="sorpresa">0</span></button>
  <button onclick="reaccion('tristeza')">😢 <span id="tristeza">0</span></button>
  <button onclick="reaccion('enojo')">😡 <span id="enojo">0</span></button>
</div>

<!-- 💬 COMENTARIOS -->
<div class="comentarios">
  <h3>Comentarios</h3>

  <input id="nombreComentario" placeholder="Tu nombre">
  <textarea id="textoComentario" placeholder="Escribí tu comentario..."></textarea>
  <button onclick="enviarComentario()">Enviar</button>

  <div id="listaComentarios"></div>
</div>

<footer>
  © 2026 Apophis Noticias |
  <a href="privacidad.html">Privacidad</a> |
  <a href="contacto.html">Contacto</a> |
  <a href="sobre.html">Sobre Nosotros</a>
</footer>

<script>
const API="https://apophis-noticias-backend.vercel.app";
let noticiaId="";

function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("darkMode", document.body.classList.contains("dark"));
}
if(localStorage.getItem("darkMode")==="true"){
  document.body.classList.add("dark");
}

function formatearFecha(fecha){
  const f = fecha ? new Date(fecha) : new Date();
  return f.toLocaleDateString("es-AR",{day:"numeric",month:"long",year:"numeric"});
}

async function cargarNoticia(){
  const id=new URLSearchParams(location.search).get("id");
  noticiaId=id;

  const res=await fetch(API+"/noticias/"+id);
  const n=await res.json();

  document.getElementById("noticiaContainer").innerHTML=`
    <h1>${n.titulo}</h1>
    <p>🗓 ${formatearFecha(n.fecha)}</p>
    <img src="${n.imagen}" style="width:100%">
    <div>${n.contenido}</div>
  `;

  likes.innerText=n.likes||0;
  dislikes.innerText=n.dislikes||0;
  sorpresa.innerText=n.sorpresa||0;
  tristeza.innerText=n.tristeza||0;
  enojo.innerText=n.enojo||0;

  // relacionadas
  const rel=await fetch(API+"/noticias/categoria/"+n.categoria);
  const dataRel=await rel.json();

  relacionadas.innerHTML=dataRel
    .filter(r=>r._id!==n._id)
    .map(r=>`
      <div class="rel-card" style="background-image:url('${r.imagen}')" onclick="ir('${r._id}')">
        <span>${r.titulo}</span>
      </div>
    `).join("");

  // comentarios
  listaComentarios.innerHTML=(n.comentarios||[]).map((c,i)=>`
    <div class="comentario">
      <strong>${c.nombre}</strong>
      <p>${c.texto}</p>

      <input id="respNombre${i}" placeholder="Tu nombre">
      <input id="respTexto${i}" placeholder="Responder...">
      <button onclick="responder(${i})">Responder</button>

      ${(c.respuestas||[]).map(r=>`
        <div class="respuesta">
          <strong>${r.nombre}</strong>: ${r.texto}
        </div>
      `).join("")}
    </div>
  `).join("");
}

async function reaccion(tipo){
  const key="react_"+noticiaId;

  if(localStorage.getItem(key)){
    alert("Ya reaccionaste");
    return;
  }

  await fetch(API+"/noticias/"+noticiaId,{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({[tipo]:1})
  });

  localStorage.setItem(key,true);
  cargarNoticia();
}

async function enviarComentario(){
  const nombre = nombreComentario.value;
  const texto = textoComentario.value;

  await fetch(API+"/comentario/"+noticiaId,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({nombre,texto})
  });

  textoComentario.value="";
  cargarNoticia();
}

async function responder(i){
  const nombre = document.getElementById("respNombre"+i).value;
  const texto = document.getElementById("respTexto"+i).value;

  await fetch(API+"/respuesta/"+noticiaId+"/"+i,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({nombre,texto})
  });

  cargarNoticia();
}

function ir(id){location="noticia.html?id="+id;}

window.onload=cargarNoticia;
</script>

</body>
</html>
