<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="metaTitle">Noticia - Apophis Noticias</title>

<meta name="description" id="metaDesc">
<meta name="robots" content="index, follow">

<meta property="og:title" id="ogTitle">
<meta property="og:description" id="ogDesc">
<meta property="og:type" content="article">
<meta property="og:url" id="ogUrl">
<meta property="og:image" id="ogImg">

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6641245592697930" crossorigin="anonymous"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>

/* BASE */
body{
  margin:0;
  font-family:Georgia;
  background:#f4e3b2;
  color:#111;
}
body.dark{
  background:#111;
  color:#f0e68c;
}

/* HEADER */
.header{
  background:black;
  padding:18px;
  display:flex;
  justify-content:center;
  position:relative;
}
.logo{
  width:min(90vw,420px);
  border-radius:12px;
  cursor:pointer;
}
.dark-btn{
  position:absolute;
  right:10px;
  top:10px;
  background:#111;
  color:gold;
  border:none;
  padding:8px 12px;
  border-radius:10px;
}

/* CONTENEDOR */
.container{
  max-width:1000px;
  margin:auto;
  padding:15px;
}

/* TITULO */
h1{
  font-size:2rem;
  margin-bottom:10px;
}

/* META */
.meta{
  font-size:14px;
  opacity:.8;
  margin-bottom:15px;
}

/* IMAGEN */
.imagen{
  width:100%;
  border-radius:12px;
  margin-bottom:15px;
}

/* CONTENIDO */
.contenido{
  line-height:1.7;
  font-size:17px;
}

/* REACCIONES */
.reacciones{
  margin-top:20px;
  display:flex;
  gap:10px;
}
.reacciones button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:#111;
  color:gold;
}

/* COMENTARIOS */
.comentarios{
  margin-top:30px;
}

input, textarea{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:1px solid #111;
}

/* RELACIONADAS */
.relacionadas{
  margin-top:40px;
}

.card{
  background:#000;
  color:gold;
  padding:10px;
  border-radius:10px;
  margin:5px 0;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:600px){
  h1{font-size:1.5rem;}
  .contenido{font-size:15px;}
}

</style>
</head>

<body>

<div class="header">
  <button class="dark-btn" onclick="toggleDark()">🌙</button>
  <img src="658175444_25680405581633658_3668668824201018733_n.jpg" class="logo" onclick="location.href='index.html'">
</div>

<div class="container">

  <h1 id="titulo"></h1>
  <div class="meta" id="meta"></div>

  <img id="imagen" class="imagen">

  <div id="contenido" class="contenido"></div>

  <!-- REACCIONES -->
  <div class="reacciones">
    <button onclick="reaccion('like')">👍</button>
    <button onclick="reaccion('dislike')">👎</button>
    <button onclick="reaccion('wow')">😲</button>
    <button onclick="reaccion('sad')">😢</button>
    <button onclick="reaccion('angry')">😡</button>
  </div>

  <!-- COMENTARIOS -->
  <div class="comentarios">
    <h3>Comentarios</h3>
    <input id="nombre" placeholder="Tu nombre">
    <textarea id="comentario" placeholder="Escribí tu comentario"></textarea>
    <button onclick="comentar()">Enviar</button>

    <div id="listaComentarios"></div>
  </div>

  <!-- RELACIONADAS -->
  <div class="relacionadas">
    <h3>Noticias relacionadas</h3>
    <div id="relacionadas"></div>
  </div>

</div>

<footer style="text-align:center;background:#111;color:gold;padding:20px;">
  © 2026 Apophis Noticias
</footer>

<script>

const API="https://apophis-noticias-backend.vercel.app";
const id=new URLSearchParams(location.search).get("id");

function toggleDark(){
  document.body.classList.toggle("dark");
}

function ir(id){
  location="noticia.html?id="+id;
}

async function cargar(){
  const res=await fetch(API+"/noticias/"+id);
  const n=await res.json();

  document.getElementById("titulo").innerText=n.titulo;
  document.getElementById("meta").innerText=n.fecha+" - "+n.autor+" - "+n.categoria;
  document.getElementById("imagen").src=n.imagen;
  document.getElementById("contenido").innerHTML=n.contenido;

  // SEO dinámico
  document.title=n.titulo;
  document.getElementById("metaDesc").setAttribute("content", n.titulo);
  document.getElementById("ogTitle").setAttribute("content", n.titulo);
  document.getElementById("ogDesc").setAttribute("content", n.titulo);
  document.getElementById("ogImg").setAttribute("content", n.imagen);
  document.getElementById("ogUrl").setAttribute("content", location.href);

  cargarRelacionadas(n.categoria);
}

async function cargarRelacionadas(cat){
  const res=await fetch(API+"/noticias/categoria/"+cat);
  const data=await res.json();

  document.getElementById("relacionadas").innerHTML=data
    .filter(n=>n._id!==id)
    .slice(0,4)
    .map(n=>`<div class="card" onclick="ir('${n._id}')">${n.titulo}</div>`)
    .join("");
}

cargar();

</script>

</body>
</html>
