<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Apophis Noticias - Información actualizada de Argentina y el mundo">
<meta name="robots" content="index, follow">

<title id="metaTitle">Apophis Noticias</title>

<!-- OPEN GRAPH -->
<meta property="og:title" id="ogTitle" content="Apophis Noticias">
<meta property="og:description" id="ogDesc" content="Noticias actualizadas">
<meta property="og:type" content="article">
<meta property="og:url" id="ogUrl">
<meta property="og:image" id="ogImg">

<script type="application/ld+json" id="jsonld"></script>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6641245592697930" crossorigin="anonymous"></script>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{margin:0;font-family:Georgia;background:#f4e3b2;color:#111;transition:.3s;}
body.dark{background:#111;color:#f0e68c;}

.header{
  background:black;
  color:gold;
  padding:25px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.eyes{font-size:1.5rem;animation:blink 4s infinite;}
@keyframes blink{95%{transform:scaleY(0.1);}}

.noticia-container{max-width:900px;margin:auto;padding:15px;}
.noticia-img{width:100%;height:400px;background-size:cover;background-position:center;border-radius:12px;margin-bottom:15px;}
.noticia-texto{font-size:1.2rem;line-height:1.6;}

.reactions{display:flex;gap:5px;margin-top:15px;justify-content:center;}
.reactions button{background:#111;color:gold;padding:6px 10px;border-radius:6px;}

.dark-toggle{
  position:fixed;
  top:10px;
  left:10px;
  background:#111;
  color:gold;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

footer{margin-top:40px;padding:20px;text-align:center;background:#111;color:gold;}
</style>
</head>

<body>

<div class="dark-toggle" onclick="toggleDark()">🌙</div>

<div class="header">
  <span class="eyes">𓂀</span>
  <span onclick="location.href='index.html'" style="cursor:pointer;font-size:2rem;">APOPHIS NOTICIAS</span>
  <span class="eyes">𓂀</span>
</div>

<div class="noticia-container" id="noticiaContainer"></div>

<div class="reactions">
  <button onclick="reaccion('likes')">👍</button>
  <button onclick="reaccion('dislikes')">👎</button>
  <button onclick="reaccion('sorpresa')">😲</button>
  <button onclick="reaccion('tristeza')">😢</button>
  <button onclick="reaccion('enojo')">😡</button>
</div>

<footer>
  © 2026 Apophis Noticias |
  <a href="privacidad.html">Privacidad</a> |
  <a href="contacto.html">Contacto</a> |
  <a href="sobre.html">Sobre Nosotros</a>
</footer>

<script>
const API="https://apophis-noticias-backend.vercel.app";
let noticiaId="";

// 🌙 MODO OSCURO BIEN HECHO
function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("darkMode", document.body.classList.contains("dark"));
}

// aplicar antes de render
if(localStorage.getItem("darkMode")==="true"){
  document.body.classList.add("dark");
}

// 🔥 CARGA REAL DE NOTICIA
async function cargarNoticia(){
  try{
    const id=new URLSearchParams(location.search).get("id");

    if(!id){
      document.getElementById("noticiaContainer").innerHTML="<h2>No hay noticia seleccionada</h2>";
      return;
    }

    noticiaId=id;

    const res=await fetch(API+"/noticias/"+id);

    if(!res.ok){
      document.getElementById("noticiaContainer").innerHTML="<h2>Error cargando noticia</h2>";
      return;
    }

    const n=await res.json();

    document.getElementById("noticiaContainer").innerHTML=`
      <h1>${n.titulo}</h1>
      <div class="noticia-img" style="background-image:url('${n.imagen}')"></div>
      <div class="noticia-texto">${n.contenido}</div>
    `;

    // ✅ SEO seguro
    document.title=n.titulo;
    document.getElementById("metaTitle").innerText=n.titulo;
    document.getElementById("ogTitle").content=n.titulo;
    document.getElementById("ogDesc").content=n.titulo;
    document.getElementById("ogUrl").content=location.href;
    document.getElementById("ogImg").content=n.imagen;

  }catch(e){
    console.log("Error noticia:", e);
    document.getElementById("noticiaContainer").innerHTML="<h2>Error cargando noticia</h2>";
  }
}

// 👍 REACCIONES
async function reaccion(tipo){
  if(!noticiaId) return;

  try{
    await fetch(API+"/noticias/"+noticiaId,{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({[tipo]:1})
    });
  }catch(e){
    console.log("Error reaccion");
  }
}

// 🔥 ESTO FALTABA (CLAVE)
window.onload=cargarNoticia;

</script>

</body>
</html>
