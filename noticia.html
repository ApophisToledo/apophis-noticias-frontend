<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Apophis Noticias - Información actualizada de Argentina y el mundo">
<meta name="robots" content="index, follow">

<title id="metaTitle">Apophis Noticias</title>

<meta property="og:title" id="ogTitle" content="Apophis Noticias">
<meta property="og:description" id="ogDesc" content="Noticias actualizadas">
<meta property="og:type" content="article">
<meta property="og:url" id="ogUrl">
<meta property="og:image" id="ogImg">

<script type="application/ld+json" id="jsonld"></script>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6641245592697930" crossorigin="anonymous"></script>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{margin:0;font-family:Georgia;background:#f4e3b2;color:#111;transition:.3s;}
body.dark{background:#111;color:#f0e68c;}

.header{
  background:black;
  color:gold;
  padding:25px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.eyes{font-size:1.5rem;animation:blink 4s infinite;}
@keyframes blink{95%{transform:scaleY(0.1);}}

/* 🔥 CAJA NOTICIA (RECUPERADA) */
.noticia-container{
  max-width:900px;
  margin:auto;
  padding:20px;
  background:#fdf5d7;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.3);
}
body.dark .noticia-container{
  background:#1a1a1a;
}

/* 🔥 TITULO PRO */
.noticia-container h1{
  font-size:2.8rem;
  font-weight:900;
  text-align:center;
  margin-bottom:10px;
}

/* 🔥 INFO (autor + fecha) */
.info-noticia{
  text-align:center;
  font-size:0.9rem;
  margin-bottom:15px;
  opacity:0.8;
}

/* 🔥 EXTRA MEJORA VISUAL (NO ROMPE NADA) */
.info-noticia span{
  margin:0 5px;
}

.noticia-img{
  width:100%;
  height:400px;
  background-size:cover;
  background-position:center;
  border-radius:12px;
  margin-bottom:15px;
}

.noticia-texto{
  font-size:1.2rem;
  line-height:1.6;
  text-align:justify;
}

/* 🔥 REACCIONES */
.reactions{
  display:flex;
  gap:5px;
  margin-top:15px;
  justify-content:center;
  flex-wrap:wrap;
}
.reactions button{
  background:#111;
  color:gold;
  padding:6px 10px;
  border-radius:6px;
}

/* 🔥 RELACIONADAS */
.relacionadas{max-width:900px;margin:20px auto;}
.rel-card{
  height:100px;
  background-size:cover;
  border-radius:8px;
  margin-bottom:10px;
  cursor:pointer;
  position:relative;
}
.rel-card span{
  position:absolute;
  bottom:0;
  background:black;
  color:gold;
  width:100%;
  font-size:12px;
  padding:3px;
}

/* 🔍 */
.buscador-box{text-align:center;margin:20px;}
#buscador{padding:10px;width:60%;border-radius:8px;}

/* 🔙 */
.volver{text-align:center;margin:10px;}
.volver button{
  padding:8px 12px;
  border-radius:8px;
  background:#111;
  color:gold;
  cursor:pointer;
}

.dark-toggle{
  position:fixed;
  top:10px;
  left:10px;
  background:#111;
  color:gold;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

footer{
  margin-top:40px;
  padding:20px;
  text-align:center;
  background:#111;
  color:gold;
}
footer a{color:gold;margin:0 10px;}
</style>
</head>

<body>

<div class="dark-toggle" onclick="toggleDark()">🌙</div>

<div class="header">
  <span class="eyes">𓂀</span>
  <span onclick="location.href='index.html'" style="cursor:pointer;font-size:2rem;">APOPHIS NOTICIAS</span>
  <span class="eyes">𓂀</span>
</div>

<!-- 🔙 VOLVER -->
<div class="volver">
  <button onclick="location.href='index.html'">🏠 Volver al inicio</button>
</div>

<!-- 🔎 BUSCADOR -->
<div class="buscador-box">
  <input id="buscador" placeholder="🔍 Buscar noticias...">
</div>

<div class="noticia-container" id="noticiaContainer"></div>

<!-- 👍 REACCIONES -->
<div class="reactions">
  <button onclick="reaccion('likes')">👍 <span id="likes">0</span></button>
  <button onclick="reaccion('dislikes')">👎 <span id="dislikes">0</span></button>
  <button onclick="reaccion('sorpresa')">😲 <span id="sorpresa">0</span></button>
  <button onclick="reaccion('tristeza')">😢 <span id="tristeza">0</span></button>
  <button onclick="reaccion('enojo')">😡 <span id="enojo">0</span></button>
</div>

<!-- 📰 RELACIONADAS -->
<div class="relacionadas" id="relacionadas"></div>

<footer>
  © 2026 Apophis Noticias |
  <a href="privacidad.html">Privacidad</a> |
  <a href="contacto.html">Contacto</a> |
  <a href="sobre.html">Sobre Nosotros</a>
</footer>

<script>
const API="https://apophis-noticias-backend.vercel.app";
let noticiaId="";

// 🌙 DARK MODE
function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("darkMode", document.body.classList.contains("dark"));
}
if(localStorage.getItem("darkMode")==="true"){
  document.body.classList.add("dark");
}

// 🔥 FORMATO FECHA (MEJORADO: usa fecha real si existe)
function formatearFecha(fecha){
  const f = fecha ? new Date(fecha) : new Date();
  return f.toLocaleDateString("es-AR",{day:"numeric",month:"long",year:"numeric"});
}

// 🔥 CARGAR NOTICIA
async function cargarNoticia(){
  try{
    const id=new URLSearchParams(location.search).get("id");
    if(!id){
      noticiaContainer.innerHTML="<h2>No hay noticia seleccionada</h2>";
      return;
    }

    noticiaId=id;

    const res=await fetch(API+"/noticias/"+id);
    const n=await res.json();

    // 🔥 AUTOR Y FECHA REALES (SIN ROMPER NADA)
    const autor = n.autor || "Apophis Noticias";
    const fecha = formatearFecha(n.fecha);

    document.getElementById("noticiaContainer").innerHTML=`
      <h1>${n.titulo}</h1>
      <div class="info-noticia">
        🗓 ${fecha} <span>|</span> ✍ ${autor}
      </div>
      <div class="noticia-img" style="background-image:url('${n.imagen}')"></div>
      <div class="noticia-texto">${n.contenido}</div>
    `;

    // contadores
    likes.innerText=n.likes||0;
    dislikes.innerText=n.dislikes||0;
    sorpresa.innerText=n.sorpresa||0;
    tristeza.innerText=n.tristeza||0;
    enojo.innerText=n.enojo||0;

    // relacionadas
    const rel=await fetch(API+"/noticias/categoria/"+n.categoria);
    const dataRel=await rel.json();

    document.getElementById("relacionadas").innerHTML=
      dataRel.filter(r=>r._id!==n._id).map(r=>`
        <div class="rel-card" style="background-image:url('${r.imagen}')" onclick="ir('${r._id}')">
          <span>${r.titulo}</span>
        </div>
      `).join("");

    // SEO
    document.title=n.titulo;
    ogTitle.content=n.titulo;
    ogDesc.content=n.titulo;
    ogUrl.content=location.href;
    ogImg.content=n.imagen;

  }catch(e){
    noticiaContainer.innerHTML="<h2>Error cargando noticia</h2>";
  }
}

// 👍 SOLO 1 REACCIÓN
async function reaccion(tipo){
  const key="react_"+noticiaId;

  if(localStorage.getItem(key)){
    alert("Ya reaccionaste");
    return;
  }

  await fetch(API+"/noticias/"+noticiaId,{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({[tipo]:1})
  });

  localStorage.setItem(key,true);
  cargarNoticia();
}

// 🔎 BUSCADOR
document.getElementById("buscador").addEventListener("input",async(e)=>{
  const q=e.target.value.toLowerCase();
  const res=await fetch(API+"/noticias");
  const data=await res.json();

  const filtradas=data.filter(n=>n.titulo.toLowerCase().includes(q));

  document.getElementById("relacionadas").innerHTML=
    filtradas.map(n=>`
      <div class="rel-card" style="background-image:url('${n.imagen}')" onclick="ir('${n._id}')">
        <span>${n.titulo}</span>
      </div>
    `).join("");
});

function ir(id){location="noticia.html?id="+id;}

window.onload=cargarNoticia;
</script>

</body>
</html>
